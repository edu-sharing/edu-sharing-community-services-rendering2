apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-env
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
data:
  JAVA_OPTS: >-
    {{- with .Values.config.jvm.ram.minPercentage }}
    -XX:InitialRAMPercentage={{ . }}
    {{- end }}
    {{- with .Values.config.jvm.ram.maxPercentage }}
    -XX:MaxRAMPercentage={{ . }}
    {{- end }}    
    -Dcom.sun.management.jmxremote
    -Dcom.sun.management.jmxremote.authenticate=false
    -Dcom.sun.management.jmxremote.port=7199
    -Dcom.sun.management.jmxremote.ssl=false
    {{- if default .Values.global.debug .Values.debug }}
    -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5005
    {{- end }}
  {{- with .Values.config.libreoffice }}
  {{- $ports := list }}
  {{- range $i := until (int .processes) }}
  {{- $ports = append $ports (add (int $.Values.config.libreoffice.basePort) $i | toString) }}
  {{- end }}
  LIBREOFFICE_PORT_NUMBERS: {{ join "," $ports | quote }}
  LIBREOFFICE_MAX_TASKS_PER_PROCESS: {{ .maxTasksPerProcess | quote }}
  LIBREOFFICE_TASK_EXECUTION_TIMEOUT: {{ .taskExecutionTimeout | quote }}
  LIBREOFFICE_TASK_QUEUE_TIMEOUT: {{ .taskQueueTimeout | quote }}
  LIBREOFFICE_PROCESS_TIMEOUT: {{ .processTimeout | quote }}
  LIBREOFFICE_PROCESS_RETRY_INTERVAL: {{ .processRetryInterval | quote }}
  LIBREOFFICE_HEALTH_PROBE_ENABLED: {{ .healthProbe.enabled | quote }}
  LIBREOFFICE_HEALTH_PROBE_TIMEOUT: {{ .healthProbe.timeout | quote }}
  LIBREOFFICE_HEALTH_CACHE_TTL: {{ .healthProbe.cacheTtl | quote }}
  LIBREOFFICE_HEALTH_FAILURE_THRESHOLD: {{ .healthProbe.failureThreshold | quote }}
  {{- end }}
  {{- if .Values.securityContext.readOnlyRootFilesystem }}
  {{- /* LibreOffice/fontconfig write their cache and config below $HOME, which is /application (read-only) in the image */}}
  HOME: /tmp
  {{- end }}
  CONVERTER_WORK_DIR: {{ .Values.config.converter.workDir | quote }}
  CONVERTER_STALE_FILE_AGE: {{ .Values.config.converter.staleFileAge | quote }}
  CONVERTER_HTML_STYLE_SCAN_WINDOW: {{ .Values.config.converter.htmlStyleScanWindow | quote }}
  CONVERTER_MAX_HTML_DOM_SIZE: {{ .Values.config.converter.maxHtmlDomSize | quote }}
  SPRING_APPLICATION_JSON: {{ .Values.config.override | quote }}
