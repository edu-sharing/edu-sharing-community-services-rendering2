########################################################################################################################
# GLOBAL
########################################################################################################################

## @section Global parameters
global:

  ## @param global.annotations Define global annotations
  annotations: {}

  cluster:

    istio:
      ## @param global.cluster.istio.enabled Enable Istio Service mesh
      enabled: false

    pdb:
      ## @param global.cluster.pdb.enabled Enable PDB
      enabled: false

  ## @param global.debug Enable global debugging
  debug: false

  image:
    ## @param global.image.pullPolicy Set global image pullPolicy
    pullPolicy: Always
    ## @param global.image.pullSecrets Set global image pullSecrets
    pullSecrets: []
    ## @param global.image.registry Set global image container registry
    registry: ${docker.registry}
    ## @param global.image.repository Set global image container repository
    repository: ${docker.repository}
    ## @param global.image.common Set global image container common
    common: ${docker.common}

  metrics:
    rules:
      ## @param global.metrics.rules.enabled Enable metrics rules
      enabled: false
    scrape:
      ## @param global.metrics.scrape.interval Set prometheus scrape interval
      interval: 60s
      ## @param global.metrics.scrape.timeout Set prometheus scrape timeout
      timeout: 60s
    servicemonitor:
      ## @param global.metrics.servicemonitor.enabled Enable metrics service monitor
      enabled: false

  ## @param global.password Set global password
  password: ""

  ## @param global.security Set global custom security parameters
  security: {}

########################################################################################################################
# LOCAL
########################################################################################################################

## @section Local parameters
## @param nameOverride Override name
nameOverride: edusharing-services-rendering2-document-converter

image:
  ## @param image.name Set image name
  name: ${docker.prefix}-deploy-docker-build-document-converter
  ## @param image.tag Set image tag
  tag: ${docker.tag}

########################################################################################################################

## @param replicaCount Define amount of parallel replicas to run
replicaCount: 1

########################################################################################################################

service:

  port:
    ## @param service.port.api Set port for service API
    api: 8080
    ## @param service.port.management Set port for service management
    management: 8081

########################################################################################################################

config:

  jvm:
    ram:
      ## @param config.jvm.ram.minPercentage Set minimum memory in percentages
      minPercentage: "25.0"
      ## @param config.jvm.ram.maxPercentage Set maximum memory in percentages
      maxPercentage: "25.0"

  libreoffice:
    ## @param config.libreoffice.processes Parallel LibreOffice processes (= parallel conversions) per pod. Size resources accordingly (~1 vCPU + ~1 GiB each)
    processes: 2
    ## @param config.libreoffice.basePort First local port; each process gets the next one
    basePort: 2002
    ## @param config.libreoffice.maxTasksPerProcess Restart a process after this many conversions
    maxTasksPerProcess: 100
    ## @param config.libreoffice.taskExecutionTimeout Abort a conversion after this many ms
    taskExecutionTimeout: 120000
    ## @param config.libreoffice.taskQueueTimeout Max ms a request waits for a free process
    taskQueueTimeout: 300000
    ## @param config.libreoffice.processTimeout Max ms to start/connect/terminate one office process
    processTimeout: 120000
    ## @param config.libreoffice.processRetryInterval Pause in ms between attempts to connect to a starting office process
    processRetryInterval: 250
    healthProbe:
      ## @param config.libreoffice.healthProbe.enabled Probe LibreOffice with a small txt->pdf conversion for the readiness check (liveness stays independent)
      enabled: true
      ## @param config.libreoffice.healthProbe.timeout Deadline of one probe (Spring Duration)
      timeout: "10s"
      ## @param config.libreoffice.healthProbe.cacheTtl How long a probe result is reused (Spring Duration)
      cacheTtl: "30s"
      ## @param config.libreoffice.healthProbe.failureThreshold Consecutive probe failures before readiness goes DOWN
      failureThreshold: 3

  converter:
    ## @param config.converter.workDir Directory for temp files of the conversion pipeline (empty = java.io.tmpdir/doc-converter)
    workDir: ""
    ## @param config.converter.staleFileAge Age after which the startup sweep deletes stale temp files and LibreOffice profile directories (Spring Duration)
    staleFileAge: "6h"
    ## @param config.converter.htmlStyleScanWindow Size of the leading window scanned for HTML styles (Spring DataSize)
    htmlStyleScanWindow: "256KB"
    ## @param config.converter.maxHtmlDomSize Max HTML size parsed into a DOM; larger results are streamed unparsed (Spring DataSize)
    maxHtmlDomSize: "32MB"

  metrics:
    ## @param config.metrics.relabelings Define relabelings for metrics
    relabelings: []

    rules:

      jvmHighGCRate:
        ## @param config.metrics.rules.jvmHighGCRate.enabled Enable metric rule jvmHighGCRate
        enabled: true
        config:
          ## @param config.metrics.rules.jvmHighGCRate.config.max Set metric rule jvmHighGCRate max gc rate
          max: 0.3
        ## @param config.metrics.rules.jvmHighGCRate.for Set metric rule jvmHighGCRate wait interval
        for: 5m
        labels:
          ## @param config.metrics.rules.jvmHighGCRate.labels.severity Set metric rule jvmHighGCRate severity level
          severity: critical

  ## @param config.override Configure overrides
  override: ""

########################################################################################################################

## @param debug Enable debugging
debug: false

########################################################################################################################

## @param nodeAffinity Set node affinity
nodeAffinity: {}

## @param podAntiAffinity Set pod antiaffinity
podAntiAffinity: "soft"

## @param tolerations Set tolerations
tolerations: []

########################################################################################################################
## @param podAnnotations Set custom pod annotations
podAnnotations: {}

## PodDisruptionBudget, rendered only when global.cluster.pdb.enabled is set AND more than one replica runs
podDisruptionBudget:
  ## @param podDisruptionBudget.minAvailable Pods that must stay available during voluntary disruptions
  minAvailable: 1
  ## @param podDisruptionBudget.maxUnavailable Pods that may be unavailable; when set it replaces minAvailable (e.g. 1 or "25%")
  maxUnavailable: ""

########################################################################################################################

podSecurityContext:
  ## @param podSecurityContext.fsGroup Set fs group for access
  fsGroup: 1000
  ## @param podSecurityContext.fsGroupChangePolicy Set change policy for fs group
  fsGroupChangePolicy: OnRootMismatch

securityContext:

  ## @param securityContext.allowPrivilegeEscalation Allow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    ## @param securityContext.capabilities.drop Set drop capabilities
    drop:
      - ALL
  ## @param securityContext.runAsUser Define user to run under
  runAsUser: 1000
  ## @param securityContext.runAsNonRoot Refuse to start the container as root (the images run as UID 1000)
  runAsNonRoot: true
  ## @param securityContext.readOnlyRootFilesystem Mount the root filesystem read-only (only rendered when true). Prepared but off by default: test the functional paths under load in staging before enabling, see deploy/CLAUDE.md. /tmp is a writable volume in any case; HOME is then set to /tmp
  readOnlyRootFilesystem: false

########################################################################################################################

persistence:

  data:

    temp:
      ## Temp files (conversion work files, spooled uploads) live on the node's ephemeral disk, not in the
      ## container layer: /tmp is an emptyDir. That keeps them out of the writable layer and makes /tmp writable
      ## when securityContext.readOnlyRootFilesystem is enabled. No memory-backed emptyDir on purpose.
      ## @param persistence.data.temp.sizeLimit Size limit of the node-local emptyDir mounted at /tmp (empty = unlimited)
      sizeLimit: ""

########################################################################################################################

## @param terminationGracePeriod Define grace period for termination
terminationGracePeriod: 120

## @param preStopSleepSeconds Seconds the container sleeps in its preStop hook before SIGTERM, so the endpoint removal reaches Ingress/Service proxies first (0 = no hook). Counts against terminationGracePeriod
preStopSleepSeconds: 5

startupProbe:
  ## @param startupProbe.failureThreshold Failure threshold for startupProbe
  failureThreshold: 30
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  initialDelaySeconds: 0
  ## @param startupProbe.periodSeconds Period seconds for startupProbe
  periodSeconds: 20
  ## @param startupProbe.successThreshold Success threshold for startupProbe
  successThreshold: 1
  ## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
  timeoutSeconds: 10

livenessProbe:
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  failureThreshold: 3
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  initialDelaySeconds: 30
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  periodSeconds: 30
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  timeoutSeconds: 10

readinessProbe:
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  failureThreshold: 1
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  initialDelaySeconds: 10
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  periodSeconds: 10
  ## @param readinessProbe.successThreshold Set threshold for success on readiness probe
  successThreshold: 1
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  timeoutSeconds: 10

########################################################################################################################

# Sized for config.libreoffice.processes (~1 vCPU + ~1 GiB per LibreOffice process). The JVM heap is kept
# small (config.jvm.ram) because LibreOffice runs as a subprocess outside the heap and needs the rest.
resources:

  limits:
    ## @param resources.limits.cpu Set CPU limit on resources
    cpu: 2
    ## @param resources.limits.memory Set memory limit on resources
    memory: 4Gi
  requests:
    ## @param resources.requests.cpu Set CPU for requests on resources
    cpu: 2
    ## @param resources.requests.memory Set memory for requests on resources
    memory: 4Gi

########################################################################################################################
