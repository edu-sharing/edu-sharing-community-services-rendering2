apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-env
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.config.s3.username | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ default .Values.global.password .Values.config.s3.password | b64enc | quote }}
  {{- $mongodb := .Values.config.mongodb }}
  {{- $mongodbPort := $mongodb.port | int }}
  {{- $mongodbReplicas := $mongodb.replicas | int }}
  {{- $mongodbHosts := list }}
  {{- if gt $mongodbReplicas 1 }}
  {{- range $index := until $mongodbReplicas }}
  {{- $mongodbHosts = append $mongodbHosts (printf "%s-%d:%d" $mongodb.host $index $mongodbPort) }}
  {{- end }}
  {{- else }}
  {{- $mongodbHosts = append $mongodbHosts (printf "%s:%d" $mongodb.host $mongodbPort) }}
  {{- end }}
  MONGODB_URL: {{ (printf "mongodb://%s:%s@%s/%s" $mongodb.username ((default .Values.global.password $mongodb.password) | urlquery | replace "+" "%20") (join "," $mongodbHosts) $mongodb.database) | b64enc | quote }}
