apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "edusharing_common_lib.labels.app" . | nindent 6 }}
  serviceName: {{ include "edusharing_common_lib.names.name" . }}-headless
  template:
    metadata:
      labels: {{ include "edusharing_common_lib.labels.app" . | nindent 8 }}
      annotations:
        checksum/configmap-env: {{ include (print .Template.BasePath "/configmap-env.yaml") . | sha256sum | trunc 63 }}
        checksum/secret-env: {{ include (print .Template.BasePath "/secret-env.yaml") . | sha256sum | trunc 63 }}
        {{- if not .Values.global.metrics.servicemonitor.enabled }}
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
        prometheus.io/scrape: "true"
        {{- end }}
        sidecar.istio.io/inject: {{ .Values.global.cluster.istio.enabled | quote }}
        {{- with merge .Values.podAnnotations .Values.global.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
      - name: {{ include "edusharing_common_lib.names.name" . }}
        image: {{ include "edusharing_common_lib.images.image" . }}{{ $.Values.image.name }}:{{ $.Values.image.tag }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: {{ include "edusharing_common_lib.names.name" . }}-env
        - secretRef:
            name: {{ include "edusharing_common_lib.names.name" . }}-env
        ports:
        - name: api
          containerPort: 3000
        volumeMounts:
        {{- if eq .Values.config.libraryCache.mode "package" }}
        - name: library-cache
          mountPath: {{ .Values.config.libraryCache.dir | quote }}
        {{- end }}
        {{- /* /tmp is always writable: the temp volume if requested, else a node-local emptyDir (see volumes) */}}
        - name: temp
          mountPath: /tmp
        {{- with .Values.startupProbe }}
        startupProbe:
          httpGet:
            path: {{ printf "%s/public/h5p/edusharing/ping" $.Values.config.base }}
            port: api
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          httpGet:
            path: {{ printf "%s/public/h5p/edusharing/ping" $.Values.config.base }}
            port: api
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          httpGet:
            path: {{ printf "%s/public/h5p/edusharing/ping" $.Values.config.base }}
            port: api
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- if .Values.preStopSleepSeconds }}
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
        {{- end }}
        {{- with .Values.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- /* readOnlyRootFilesystem is only rendered when enabled, so the default rendering stays unchanged */}}
          {{- toYaml (omit . "readOnlyRootFilesystem") | nindent 10 }}
          {{- if .readOnlyRootFilesystem }}
          readOnlyRootFilesystem: true
          {{- end }}
        {{- end }}
      {{- with .Values.global.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with merge .Values.podSecurityContext .Values.global.security }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{ with .Values.terminationGracePeriod }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if or .Values.nodeAffinity .Values.podAntiAffinity }}
      affinity:
        {{- with .Values.nodeAffinity }}
        nodeAffinity: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.podAntiAffinity }}
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: {{ include "edusharing_common_lib.labels.app" . | nindent 16 }}
          {{- else if eq .Values.podAntiAffinity "soft" }}
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {{ include "edusharing_common_lib.labels.app" . | nindent 18 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if not .Values.persistence.data.temp.create }}
      volumes:
      - name: temp
        {{- /* Temp files live on the node's ephemeral disk (no memory-backed emptyDir). Needed as a writable /tmp
             when securityContext.readOnlyRootFilesystem is enabled; a Dockerfile VOLUME is ignored by Kubernetes. */}}
        {{- if .Values.persistence.data.temp.sizeLimit }}
        emptyDir:
          sizeLimit: {{ .Values.persistence.data.temp.sizeLimit | quote }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
  {{/* The per-package library cache is the only copy of those packages' libraries, so the volume is
       not optional for it - it follows the mode rather than a flag of its own, which removes the
       "package mode without storage" misconfiguration. In "global" mode no claim is created. The temp
       volume is the opposite: opt-in, like the service's; without it /tmp is a node-local emptyDir. */}}
  {{- if or (eq .Values.config.libraryCache.mode "package") .Values.persistence.data.temp.create }}
  volumeClaimTemplates:
  {{- if eq .Values.config.libraryCache.mode "package" }}
  - metadata:
      name: library-cache
      labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 8 }}
    spec: {{ merge $.Values.persistence.data.libraryCache.spec $.Values.global.cluster.storage.data.spec | toYaml | nindent 6 }}
  {{- end }}
  {{- if .Values.persistence.data.temp.create }}
  - metadata:
      name: temp
      labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 8 }}
    spec: {{ merge $.Values.persistence.data.temp.spec $.Values.global.cluster.storage.data.spec | toYaml | nindent 6 }}
  {{- end }}
  {{- end }}
