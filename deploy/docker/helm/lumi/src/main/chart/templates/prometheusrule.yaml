{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- if .Values.global.metrics.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  groups:
    - name: {{ include "edusharing_common_lib.names.name" . }}
      rules:
        {{- if .Values.config.metrics.rules.nodejsUp.enabled }}
        - alert: nodejsUp
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} isn't up since {{ .Values.config.metrics.rules.nodejsUp.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} isn't up.
          expr: >-
            rate(up{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"}[5m]) < 1
          for: {{ .Values.config.metrics.rules.nodejsUp.for }}
          labels: {{ toYaml .Values.config.metrics.rules.nodejsUp.labels | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}