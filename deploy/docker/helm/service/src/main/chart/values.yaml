########################################################################################################################
# GLOBAL
########################################################################################################################

## @section Global parameters
global:

  ## @param global.annotations Set global annotations
  annotations: {}

  cluster:

    cert:
      ## @param global.cluster.cert.annotations Set global cluster cert annotations
      annotations: {}

    ingress:
      ## @param global.cluster.ingress.ingressClassName Set global cluster ingressClass name
      ingressClassName: "nginx"

    istio:
      ## @param global.cluster.istio.enabled Enable Istio Service mesh
      enabled: false
      gateway:
        selector:
          ## @param global.cluster.istio.gateway.selector.app Set global cluster Istio selector app
          app: istio-ingressgateway

    pdb:
      ## @param global.cluster.pdb.enabled Enable PDB
      enabled: false

    storage:

      data:
        ## @param global.cluster.storage.data.permission Enable global custom data storage permissions
        permission: false
        ## @param global.cluster.storage.data.spec Set data storage spec
        spec: {}

  ## @param global.debug Enable global debugging
  debug: false

  image:
    ## @param global.image.pullPolicy Set global image pullPolicy
    pullPolicy: Always
    ## @param global.image.pullSecrets Set global image pullSecrets
    pullSecrets: []
    ## @param global.image.registry Set global image container registry
    registry: ${docker.registry}
    ## @param global.image.repository Set global image container repository
    repository: ${docker.repository}
    ## @param global.image.common Set global image container common
    common: ${docker.common}

  metrics:
    rules:
      ## @param global.metrics.rules.enabled Enable metrics rules
      enabled: false
    scrape:
      ## @param global.metrics.scrape.interval Set prometheus scrape interval
      interval: 60s
      ## @param global.metrics.scrape.timeout Set prometheus scrape timeout
      timeout: 60s
    servicemonitor:
      ## @param global.metrics.servicemonitor.enabled Enable metrics service monitor
      enabled: false

  ## @param global.password Set global password
  password: ""

  ## @param global.security Set global security parameters
  security: {}

########################################################################################################################
# LOCAL
########################################################################################################################

## @section Local parameters
## @param nameOverride Override name
nameOverride: edusharing-services-rendering2-service

image:
  ## @param image.name Set image name
  name: ${docker.prefix}-deploy-docker-build-service
  ## @param image.tag Set image tag
  tag: ${docker.tag}

########################################################################################################################

roles:

  aio:
    ## @param roles.aio.enabled Enabled aio role
    enabled: true
    ## @param roles.aio.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.aio.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.aio.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.aio.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.aio.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.aio.appRoles Define application roles
    appRoles: "master,controller,job-manager,converter,avconverter"
    ## @param roles.aio.subpaths Define ingress subpaths
    subpaths:
      - "/admin"
      - "/public"
    ## aio bundles every (heavy) converter incl. ffmpeg in one JVM -> generous sizing, low heap %
    resources:
      limits:
        ## @param roles.aio.resources.limits.cpu Set CPU limit for the aio role
        cpu: "1000m"
        ## @param roles.aio.resources.limits.memory Set memory limit for the aio role
        memory: 3Gi
      requests:
        ## @param roles.aio.resources.requests.cpu Set CPU request for the aio role
        cpu: "1000m"
        ## @param roles.aio.resources.requests.memory Set memory request for the aio role
        memory: 3Gi
    jvm:
      ram:
        ## @param roles.aio.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (aio)
        minPercentage: "55.0"
        ## @param roles.aio.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (aio)
        maxPercentage: "55.0"

  master:
    ## @param roles.master.enabled Enabled master role
    enabled: false
    ## @param roles.master.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.master.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.master.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.master.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.master.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.master.appRoles Define application roles
    appRoles: "master"
    ## @param roles.master.subpaths Define ingress subpaths
    subpaths:
      - "/admin"
    ## master runs only the admin API + cron (CacheCleaner) -> small, heap-lastig
    resources:
      limits:
        ## @param roles.master.resources.limits.cpu Set CPU limit for the master role
        cpu: "250m"
        ## @param roles.master.resources.limits.memory Set memory limit for the master role
        memory: 1Gi
      requests:
        ## @param roles.master.resources.requests.cpu Set CPU request for the master role
        cpu: "250m"
        ## @param roles.master.resources.requests.memory Set memory request for the master role
        memory: 1Gi
    jvm:
      ram:
        ## @param roles.master.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (master)
        minPercentage: "70.0"
        ## @param roles.master.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (master)
        maxPercentage: "70.0"

  controller:
    ## @param roles.controller.enabled Enabled controller role
    enabled: false
    ## @param roles.controller.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.controller.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.controller.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.controller.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.controller.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.controller.appRoles Define application roles
    appRoles: "controller"
    ## @param roles.controller.subpaths Define ingress subpaths
    subpaths:
      - "/public"
    ## controller serves/streams + up to 200 Tomcat threads + Netty direct buffers + sessions
    resources:
      limits:
        ## @param roles.controller.resources.limits.cpu Set CPU limit for the controller role
        cpu: "500m"
        ## @param roles.controller.resources.limits.memory Set memory limit for the controller role
        memory: 1536Mi
      requests:
        ## @param roles.controller.resources.requests.cpu Set CPU request for the controller role
        cpu: "500m"
        ## @param roles.controller.resources.requests.memory Set memory request for the controller role
        memory: 1536Mi
    jvm:
      ram:
        ## @param roles.controller.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (controller)
        minPercentage: "70.0"
        ## @param roles.controller.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (controller)
        maxPercentage: "70.0"

  jobmanager:
    ## @param roles.jobmanager.enabled Enabled jobmanager role
    enabled: false
    ## @param roles.jobmanager.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.jobmanager.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.jobmanager.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.jobmanager.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.jobmanager.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.jobmanager.appRoles Define application roles
    appRoles: "job-manager"
    ## job-manager only orchestrates (messages carry IDs) -> smallest footprint
    resources:
      limits:
        ## @param roles.jobmanager.resources.limits.cpu Set CPU limit for the jobmanager role
        cpu: "250m"
        ## @param roles.jobmanager.resources.limits.memory Set memory limit for the jobmanager role
        memory: 768Mi
      requests:
        ## @param roles.jobmanager.resources.requests.cpu Set CPU request for the jobmanager role
        cpu: "250m"
        ## @param roles.jobmanager.resources.requests.memory Set memory request for the jobmanager role
        memory: 768Mi
    jvm:
      ram:
        ## @param roles.jobmanager.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (jobmanager)
        minPercentage: "70.0"
        ## @param roles.jobmanager.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (jobmanager)
        maxPercentage: "70.0"

  converter:
    ## @param roles.converter.enabled Enabled converter role
    enabled: false
    ## @param roles.converter.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.converter.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.converter.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.converter.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.converter.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.converter.appRoles Define application roles
    appRoles: "converter"
    ## converter decodes images fully in the heap (heap-lastig, little off-heap) -> higher heap %
    resources:
      limits:
        ## @param roles.converter.resources.limits.cpu Set CPU limit for the converter role
        cpu: "1000m"
        ## @param roles.converter.resources.limits.memory Set memory limit for the converter role
        memory: 2Gi
      requests:
        ## @param roles.converter.resources.requests.cpu Set CPU request for the converter role
        cpu: "1000m"
        ## @param roles.converter.resources.requests.memory Set memory request for the converter role
        memory: 2Gi
    jvm:
      ram:
        ## @param roles.converter.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (converter)
        minPercentage: "75.0"
        ## @param roles.converter.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (converter)
        maxPercentage: "75.0"

  avconverter:
    ## @param roles.avconverter.enabled Enabled avconverter role
    enabled: false
    ## @param roles.avconverter.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.avconverter.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.avconverter.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.avconverter.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.avconverter.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.avconverter.appRoles Define application roles
    appRoles: "avconverter"
    ## avconverter: work is the OFF-HEAP ffmpeg process (CPU-bound); the JVM only orchestrates + streams I/O.
    ## Temp files live on the node's ephemeral disk (no memory-backed emptyDir), so they do not count against
    ## this limit. -> big container, low heap % so ~2.8Gi of the 4Gi stays free for ffmpeg RSS + non-heap JVM.
    resources:
      limits:
        ## @param roles.avconverter.resources.limits.cpu Set CPU limit for the avconverter role
        cpu: "2000m"
        ## @param roles.avconverter.resources.limits.memory Set memory limit for the avconverter role
        memory: 4Gi
      requests:
        ## @param roles.avconverter.resources.requests.cpu Set CPU request for the avconverter role
        cpu: "2000m"
        ## @param roles.avconverter.resources.requests.memory Set memory request for the avconverter role
        memory: 4Gi
    jvm:
      ram:
        ## @param roles.avconverter.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (avconverter)
        minPercentage: "30.0"
        ## @param roles.avconverter.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (avconverter)
        maxPercentage: "30.0"

  ## The worker role is the Master+Worker topology counterpart to master: it bundles every
  ## non-master role in one instance. To run Master+Worker, enable master + worker and disable aio
  ## (the worker carries the controller role that serves /public, so the internal service selects it).
  worker:
    ## @param roles.worker.enabled Enabled worker role (composite: everything except master)
    enabled: false
    ## @param roles.worker.replicaCount Define amount of parallel replicas to run
    replicaCount: 1
    autoscaling:
      ## @param roles.worker.autoscaling.enabled Enable autoscaling
      enabled: false
      ## @param roles.worker.autoscaling.minReplicas Define minimum number of replicas to have running
      minReplicas: 3
      ## @param roles.worker.autoscaling.maxReplicas Define maximum number of replicas to have running
      maxReplicas: 5
      ## @param roles.worker.autoscaling.targetCPU Set CPU limit when to scale
      targetCPU: 80
    ## @param roles.worker.appRoles Define application roles (no spaces: app.roles split(',') does not trim)
    appRoles: "controller,job-manager,converter,avconverter"
    ## @param roles.worker.subpaths Define ingress subpaths
    subpaths:
      - "/public"
    ## worker = controller+job-manager+converter+avconverter in one JVM -> heaviest combination, sized like avconverter
    resources:
      limits:
        ## @param roles.worker.resources.limits.cpu Set CPU limit for the worker role
        cpu: "2000m"
        ## @param roles.worker.resources.limits.memory Set memory limit for the worker role
        memory: 4Gi
      requests:
        ## @param roles.worker.resources.requests.cpu Set CPU request for the worker role
        cpu: "2000m"
        ## @param roles.worker.resources.requests.memory Set memory request for the worker role
        memory: 4Gi
    jvm:
      ram:
        ## @param roles.worker.jvm.ram.minPercentage JVM initial heap as % of the container memory limit (worker)
        minPercentage: "50.0"
        ## @param roles.worker.jvm.ram.maxPercentage JVM max heap as % of the container memory limit (worker)
        maxPercentage: "50.0"

########################################################################################################################

service:

  port:
    ## @param service.port.api Set port for service API
    api: 8080
    metrics:
      ## @param service.port.metrics.api Set port for metrics API
      api: 9080
      ## @param service.port.metrics.proxy Set port for metrics proxy
      proxy: 9118

########################################################################################################################

ingress:

  ## @param ingress.enabled Enable ingress
  enabled: true

  annotations:
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/affinity Set affinity on nginx ingress
    nginx.ingress.kubernetes.io/affinity: cookie
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-body-size Set proxy-body-size on nginx ingress
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-connect-timeout Set proxy-connect-timeout on nginx ingress
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-read-timeout Set proxy-read-timeout on nginx ingress
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-send-timeout Set proxy-send-timeout on nginx ingress
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-pass-headers Set proxy-pass-headers on nginx ingress
    nginx.ingress.kubernetes.io/proxy-pass-headers: "Authentication-Info"

  ## @param ingress.hosts Set ingress hosts
  hosts:
  - rendering.services.127.0.0.1.nip.io

  ## @param ingress.tls Set TLS for ingress
  # e.g.:
  #  - secretName: edusharing-services-rendering-tls
  #    hosts:
  #    - rendering.services.127.0.0.1.nip.io
  tls: []

  ## @param ingress.paths Set paths for ingress
  paths:
  - /rendering

########################################################################################################################

proxy:

  ## @param proxy.enabled Enable proxy
  enabled: false
  config:
    backend:
      ## @param proxy.config.backend.connectTimeout Set proxy connection timeout
      connectTimeout: 60
      ## @param proxy.config.backend.firstByteTimeout Set proxy first byte timeout
      firstByteTimeout: 180
      ## @param proxy.config.backend.betweenBytesTimeout Set proxy between bytes timeout
      betweenBytesTimeout: 180
      ## @param proxy.config.backend.maxConnections Set maximum connections on proxy
      maxConnections: 200
    cache:
      ## @param proxy.config.cache.control Set proxy cache control
      control: public
      ## @param proxy.config.cache.ttl Set proxy cache ttl
      ttl: 3600
    deliver:
      ## @param proxy.config.deliver.gzip Enable proxy to deliver gzip compressed
      gzip: false

########################################################################################################################

config:

  admin:
    ## @param config.admin.password Set admin password
    password: ""

  cache:
    cleaner:
      ## @param config.cache.cleaner.schedule Set schedule for cache cleaner
      schedule: 0 0 1 * * *
      threshold:
        ## @param config.cache.cleaner.threshold.lower Set lower threshold for cache cleaner
        lower: 0.7
        ## @param config.cache.cleaner.threshold.upper Set upper threshold for cache cleaner
        upper: 0.9

  ## Stale-job reaper (master only): times out orphaned PROCESSING sub-jobs so a crashed/lost conversion
  ## cannot poison re-rendering of a node until the 8-day TTL. See StaleJobReaper.
  jobreaper:
    ## @param config.jobreaper.enabled Enable the stale-job reaper
    enabled: true
    ## @param config.jobreaper.schedule Fixed delay in milliseconds between reaper runs
    schedule: "600000"
    ## @param config.jobreaper.defaultMaxProcessTime Max processing time (ISO-8601 Duration) before a PROCESSING sub-job is timed out, for any routing key without an explicit override
    defaultMaxProcessTime: "PT30M"
    ## Per-routing-key overrides (ISO-8601 Duration); key = queue routing key (app.queue.<module>.key)
    maxProcessTime:
      ## @param config.jobreaper.maxProcessTime.av_job Max processing time for av_job (ffmpeg guard is PT30M, so give headroom)
      av_job: "PT45M"

  converter:
    audio:
      ## @param config.converter.audio.mimetypes Set mimetypes for audio converter
      mimetypes: audio/mpeg,audio/mp4,audio/vnd.wav,audio/ogg,audio/vorbis,audio/wav,audio/x-wav,audio/x-ms-wma
      ## @param config.converter.audio.bitrate Set bitrate for audio converter
      bitrate: 160
      ## @param config.converter.audio.ffmpegThreads Set ffmpeg threads for audio converter
      ffmpegThreads: 1
    av:
      ## @param config.converter.av.ffmpegPath Path to the ffmpeg executable (installed in the image; override with an absolute path if not on PATH)
      ffmpegPath: ffmpeg
    document:
      ## @param config.converter.document.host Set document-converter host
      host: edusharing-services-rendering2-document-converter
      ## @param config.converter.document.port Set document-converter port
      port: 8080
    image:
      ## @param config.converter.image.format Set format for immage converter
      format: jpeg
      ## @param config.converter.image.mimetypes Set mimetypes for immage converter
      mimetypes: image/vnd.wap.wbmp,image/x-png,image/jpeg,image/tiff,image/bmp,image/x-webp,image/webp
      ## @param config.converter.image.sizes Set sizes for immage converter
      sizes: 800,1280,1920
      ## @param config.converter.image.maxPixels Reject source images larger than this many pixels (width*height) before decoding
      maxPixels: "100000000"
    jupyter:
      ## @param config.converter.jupyter.host Set jupyter-converter host
      host: edusharing-services-rendering2-jupyter-converter
      ## @param config.converter.jupyter.port Set jupyter-converter port
      port: 8000
    video:
      ## @param config.converter.video.format Set format for video converter
      format: mp4
      ## @param config.converter.video.ffmpegThreads Set ffmpeg threads for video converter
      ffmpegThreads: 4
      ## @param config.converter.video.ffmpegPreset Set ffmpeg preset for video converter
      ffmpegPreset: veryfast
      ## @param config.converter.video.mimetypes Set mimetypes for video converter
      mimetypes: video/mp4,video/mpeg,video/quicktime,video/x-msvideo,video/vnd.avi,video/avi,video/x-flv,video/x-matroska,video/ogg,video/x-ms-wmv,video/theora
      ## @param config.converter.video.resolutions Set resolutions for video converter
      resolutions: 480,720,1080

  home:
    ## @param config.home.appid Set home app id
    appid: rendering2

    registrations:
      ## @param config.home.registrations[0].id Set id for repository registration
    - id: local
      ## @param config.home.registrations[0].url Set url for repository registration
      url: http://edusharing-repository-service:8080/edu-sharing
      ## @param config.home.registrations[0].username Set username for repository registration
      username: admin
      ## @param config.home.registrations[0].password Set password for repository registration
      password: ""
      ## @param config.home.registrations[0].quota Set storage quota in bytes for repository registration (0 = no limit; only enforced by the cache cleaner)
      quota: 0
      ## @param config.home.registrations[0].modules Set modules for repository registration
      modules: []
      # - name: BINDER
      #   credentials:
      #   - name: baseurl
      #     value:
      # - name: DDB
      #   credentials:
      #   - name: apiToken
      #     value:
      # - name: EDUHTML
      # - name: H5P
      # - name: JUPYTER
      # - name: MOODLE
      #   credentials:
      #   - name: baseurl
      #     value:
      #   - name: user
      #     value:
      #   - name: password
      #     value:
      #   - name:token
      #     value:
      #   - name: timeout
      #     value:
      #   - name: categoryid
      #     value:
      #   - name: submitUserDetails
      #     value:
      #   - name: publicurl
      # - name: SODIX
      #   credentials:
      #   - name: baseurl
      #     value:
      ## @param config.home.registrations[0].buckets Set buckets for repository registration
      buckets: []
      # - name: renderingBucket
      #   value: rendering2
      # - name: tempBucket
      #   value: temp
  jvm:
    ram:
      ## @param config.jvm.ram.minPercentage Set minimum memory in percentages
      minPercentage: "60.0"
      ## @param config.jvm.ram.maxPercentage Set maximum memory in percentages
      maxPercentage: "60.0"

  lumi:
    ## @param config.lumi.host Set lumi host
    host: edusharing-services-rendering2-lumi
    ## @param config.lumi.port Set lumi port
    port: 3000

  metrics:
    ## @param config.metrics.relabelings Define relabelings for metrics
    relabelings: []

    rules:

      jvmHighGCRate:
        ## @param config.metrics.rules.jvmHighGCRate.enabled Enable metric rule jvmHighGCRate
        enabled: true
        config:
          ## @param config.metrics.rules.jvmHighGCRate.config.max Set metric rule jvmHighGCRate max gc rate
          max: 0.3
        ## @param config.metrics.rules.jvmHighGCRate.for Set metric rule jvmHighGCRate wait interval
        for: 5m
        labels:
          ## @param config.metrics.rules.jvmHighGCRate.labels.severity Set metric rule jvmHighGCRate severity level
          severity: critical

  mongodb:
    ## @param config.mongodb.host Set mongodb host
    host: edusharing-services-rendering2-mongodb
    ## @param config.mongodb.port Set mongodb port
    port: 27017
    ## @param config.mongodb.username Set mongodb username
    username: rendering2
    ## @param config.mongodb.password Set mongodb username
    password: ""
    ## @param config.mongodb.database Set mongodb database
    database: rendering2

  ## @param config.override Configure overrides
  override: ""

  rabbitmq:
    ## @param config.rabbitmq.host Set rabbitmq host
    host: edusharing-services-rendering2-rabbitmq
    ## @param config.rabbitmq.port Set rabbitmq port
    port: 5672
    ## @param config.rabbitmq.username Set rabbitmq username
    username: rendering2
    ## @param config.rabbitmq.password Set mongodb username
    password: ""

  queue:
    ## The one per-queue scaling knob: max messages processed in parallel per pod. Its meaning per queue
    ## follows the queue's `mode` (set in application.properties, not tunable here):
    ##  - STANDARD queues (job/image/av/eduHtml/document/jupyter/onyx/binder/binderPreview): the number of
    ##    DirectMessageListenerContainer consumers registered per pod (burst fanned out at once, no
    ##    auto-scale ramp; idle consumers cost nothing on the shared virtual-thread executor).
    ##  - REMOTE queues (sodix/omega/ddb) resolve a link/reference to externally-hosted material: K — sizes
    ##    the dedicated remote HTTP pool AND the broker prefetch, K messages run in parallel on virtual
    ##    threads. Scale cluster throughput via more pods, not K.
    ## The h5p *import* queue is SINGLE_ACTIVE (exactly one consumer cluster-wide, forced to 1) and is
    ## therefore not listed — its concurrency is not tunable. The h5p lookup queue in front of it is
    ## STANDARD and is listed. Values are shared by every role deployment, so keep them
    ## conservative for co-located profiles (worker/aio) where image/eduHtml/av compete for the same cores;
    ## raise for dedicated converter/avconverter pods.
    concurrency:
      ## @param config.queue.concurrency.job Consumers for the job dispatch queue
      job: "20"
      ## @param config.queue.concurrency.image Consumers for the image queue (CPU-in-JVM; size ~ pod cores)
      image: "4"
      ## @param config.queue.concurrency.av Consumers for the audio/video queue (each spawns an ffmpeg process)
      av: "2"
      ## @param config.queue.concurrency.eduHtml Consumers for the eduHtml queue (in-JVM unzip; shares CPU with image)
      eduHtml: "5"
      ## @param config.queue.concurrency.document Consumers for the document queue (bounded by the remote converter)
      document: "8"
      ## @param config.queue.concurrency.jupyter Consumers for the jupyter queue (bounded by the remote converter)
      jupyter: "8"
      ## @param config.queue.concurrency.moodle Consumers for the moodle queue (bounded by the remote moodle server)
      moodle: "8"
      ## @param config.queue.concurrency.h5pLookup Consumers for the h5p lookup queue (pure wait: one lumi content-id lookup per message)
      h5pLookup: "20"
      ## @param config.queue.concurrency.onyx Consumers for the onyx queue
      onyx: "8"
      ## @param config.queue.concurrency.binder Consumers for the binder queue
      binder: "1"
      ## @param config.queue.concurrency.binderPreview Consumers for the binder preview queue
      binderPreview: "1"
      ## @param config.queue.concurrency.sodix Remote concurrency K for the sodix queue (HTTP pool + prefetch; scale via pods)
      sodix: "50"
      ## @param config.queue.concurrency.omega Remote concurrency K for the omega queue (HTTP pool + prefetch; scale via pods)
      omega: "50"
      ## @param config.queue.concurrency.ddb Remote concurrency K for the ddb queue (HTTP pool + prefetch; scale via pods)
      ddb: "50"

    ## @param config.queue.prefetch Global prefetch for STANDARD/SINGLE_ACTIVE queues (remote queues derive prefetch from concurrency)
    prefetch: "1"

    ## Optional per-queue prefetch override for REMOTE queues (sodix/omega/ddb) — leave empty to derive
    ## prefetch from concurrency (1:1 with the remote HTTP pool). Set only to run prefetch above concurrency
    ## while jobs spend time in post-call Mongo/S3 work; must be >= concurrency (enforced at startup).
    remotePrefetch:
      ## @param config.queue.remotePrefetch.sodix Prefetch override for the sodix remote queue (empty = derive from concurrency)
      sodix: ""
      ## @param config.queue.remotePrefetch.omega Prefetch override for the omega remote queue (empty = derive from concurrency)
      omega: ""
      ## @param config.queue.remotePrefetch.ddb Prefetch override for the ddb remote queue (empty = derive from concurrency)
      ddb: ""

  redis:
    ## @param config.redis.host Set redis host
    host: edusharing-services-rendering2-rediscluster
    ## @param config.redis.port Set redis port
    port: 6379

  s3:
    ## @param config.s3.host Set S3 host
    host: edusharing-services-rendering2-minio
    ## @param config.s3.port Set S3 port
    port: 9000
    ## @param config.s3.username Set S3 username
    username: rendering2
    ## @param config.s3.password Set S3 password
    password: ""
    ## @param config.s3.protocol Set S3 protocol
    protocol: http
    ## @param config.s3.region Set S3 region
    region: eu-central-1
    ## @param config.s3.mode Set S3 mode [byType|byCustomer|externalBucket]
    mode: byType
    ## @param config.s3.trustAllCertificates Set S3 trust all certificates
    trustAllCertificates: false
    ## @param config.s3.checksumCalculationWhenRequired Set S3 checksum calculation when required
    checksumCalculationWhenRequired: false

  webclient:
    codec:
      ## @param config.webclient.codec.maxInMemorySize Set a limit on the number of bytes that can be buffered by the webclient whenever the input stream needs to be aggregated.
      maxInMemorySize: "20MB"

  session:
    cookie:
      ## @param config.session.cookie.samesite Set session cookie same-site
      samesite: none
      ## @param config.session.cookie.secure Set session cookie secure
      secure: true
      ## @param config.session.cookie.partitioned Set session cookie partitioned
      partitioned: true
    nodePermissionExpirationTime:
      ## @param config.session.nodePermissionExpirationTime.audio Set session nodePermissionExpirationTime for audio
      audio: ""
      ## @param config.session.nodePermissionExpirationTime.default Set default session nodePermissionExpirationTime
      default: 60
      ## @param config.session.nodePermissionExpirationTime.document Set session nodePermissionExpirationTime for document
      document: ""
      ## @param config.session.nodePermissionExpirationTime.eduhtml Set session nodePermissionExpirationTime for eduhtml
      eduhtml: 7200
      ## @param config.session.nodePermissionExpirationTime.h5p Set session nodePermissionExpirationTime for h5p
      h5p: ""
      ## @param config.session.nodePermissionExpirationTime.html Set session nodePermissionExpirationTime for html
      html: ""
      ## @param config.session.nodePermissionExpirationTime.image Set session nodePermissionExpirationTime for image
      image: ""
      ## @param config.session.nodePermissionExpirationTime.moodle Set session nodePermissionExpirationTime for moodle
      moodle: ""
      ## @param config.session.nodePermissionExpirationTime.pdf Set session nodePermissionExpirationTime for pdf
      pdf: ""
      ## @param config.session.nodePermissionExpirationTime.scorm Set session nodePermissionExpirationTime for scorm
      scorm: ""
      ## @param config.session.nodePermissionExpirationTime.sodix Set session nodePermissionExpirationTime for sodix
      sodix: 7200
      ## @param config.session.nodePermissionExpirationTime.spreadsheet Set session nodePermissionExpirationTime for spreadsheet
      spreadsheet: ""
      ## @param config.session.nodePermissionExpirationTime.video Set session nodePermissionExpirationTime for video
      video: ""

########################################################################################################################

## @param debug Enable debugging
debug: false

########################################################################################################################

persistence:

  data:

    temp:
      ## @param persistence.data.temp.create Create temporary data
      create: false
      spec:
        ## @param persistence.data.temp.spec.accessModes Set access modes for temporary data
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            ## @param persistence.data.temp.spec.resources.requests.storage Set storage request for temporary data
            storage: 1Gi

########################################################################################################################

## @param nodeAffinity Set node affinity
nodeAffinity: {}
## @param podAntiAffinity Set pod antiaffinity
podAntiAffinity: "soft"

## @param tolerations Set tolerations
tolerations: []

########################################################################################################################

## @param podAnnotations Set custom pod annotations
podAnnotations: {}

podSecurityContext:
  ## @param podSecurityContext.fsGroup Set fs group for access
  fsGroup: 1000
  ## @param podSecurityContext.fsGroupChangePolicy Set change policy for fs group
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  ## @param securityContext.allowPrivilegeEscalation Allow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    ## @param securityContext.capabilities.drop Set drop capabilities
    drop:
      - ALL
  ## @param securityContext.runAsUser Set drop capabilities
  runAsUser: 1000

########################################################################################################################

## @param terminationGracePeriod Define grace period for termination
terminationGracePeriod: 120

startupProbe:
  ## @param startupProbe.failureThreshold Failure threshold for startupProbe
  failureThreshold: 30
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  initialDelaySeconds: 0
  ## @param startupProbe.periodSeconds Period seconds for startupProbe
  periodSeconds: 30
  ## @param startupProbe.successThreshold Success threshold for startupProbe
  successThreshold: 1
  ## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
  timeoutSeconds: 10

livenessProbe:
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  failureThreshold: 3
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  initialDelaySeconds: 30
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  periodSeconds: 30
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  timeoutSeconds: 10

readinessProbe:
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  failureThreshold: 1
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  initialDelaySeconds: 10
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  periodSeconds: 10
  ## @param readinessProbe.successThreshold Set threshold for success on readiness probe
  successThreshold: 1
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  timeoutSeconds: 10

########################################################################################################################

resources:

  limits:
    ## @param resources.limits.cpu Set CPU limit on resources
    cpu: 500m
    ## @param resources.limits.memory Set memory limit on resources
    memory: 2Gi
  requests:
    ## @param resources.requests.cpu Set CPU for requests on resources
    cpu: 500m
    ## @param resources.requests.memory Set memory for requests on resources
    memory: 2Gi

########################################################################################################################

sidecar:

  proxyCache:

    image:
      ## @param sidecar.proxyCache.image.name Set proxyCache sidecar image name
      name: ${docker.edu_sharing.community.common.varnish.name}
      ## @param sidecar.proxyCache.image.tag Set proxyCache sidecar image tag
      tag: ${docker.edu_sharing.community.common.varnish.tag}

    startupProbe:
      ## @param sidecar.proxyCache.startupProbe.failureThreshold Failure threshold for startupProbe
      failureThreshold: 30
      ## @param sidecar.proxyCache.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
      initialDelaySeconds: 0
      ## @param sidecar.proxyCache.startupProbe.periodSeconds Period seconds for startupProbe
      periodSeconds: 20
      ## @param sidecar.proxyCache.startupProbe.successThreshold Success threshold for startupProbe
      successThreshold: 1
      ## @param sidecar.proxyCache.startupProbe.timeoutSeconds Timeout seconds for startupProbe
      timeoutSeconds: 10

    livenessProbe:
      ## @param sidecar.proxyCache.livenessProbe.failureThreshold Failure threshold for livenessProbe
      failureThreshold: 3
      ## @param sidecar.proxyCache.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
      initialDelaySeconds: 30
      ## @param sidecar.proxyCache.livenessProbe.periodSeconds Period seconds for livenessProbe
      periodSeconds: 30
      ## @param sidecar.proxyCache.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
      timeoutSeconds: 10

    readinessProbe:
      ## @param sidecar.proxyCache.readinessProbe.failureThreshold Failure threshold for readinessProbe
      failureThreshold: 1
      ## @param sidecar.proxyCache.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
      initialDelaySeconds: 10
      ## @param sidecar.proxyCache.readinessProbe.periodSeconds Period seconds for readinessProbe
      periodSeconds: 10
      ## @param sidecar.proxyCache.readinessProbe.successThreshold Set threshold for success on readiness probe
      successThreshold: 1
      ## @param sidecar.proxyCache.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
      timeoutSeconds: 10

    resources:
      limits:
        ## @param sidecar.proxyCache.resources.limits.cpu Set CPU limit on resources
        cpu: 500m
        ## @param sidecar.proxyCache.resources.limits.memory Set memory limit on resources
        memory: 2Gi
      requests:
        ## @param sidecar.proxyCache.resources.requests.cpu Set CPU for requests on resources
        cpu: 500m
        ## @param sidecar.proxyCache.resources.requests.memory Set memory for requests on resources
        memory: 2Gi

    securityContext:

      ## @param sidecar.proxyCache.securityContext.allowPrivilegeEscalation Allow privilege escalation
      allowPrivilegeEscalation: false
      capabilities:
        ## @param sidecar.proxyCache.securityContext.capabilities.drop Set drop capabilities
        drop:
          - ALL
      ## @param sidecar.proxyCache.securityContext.runAsUser Define user to run under
      runAsUser: 101

  proxyMetrics:

    image:
      ## @param sidecar.proxyMetrics.image.name Set proxyMetrics sidecar image name
      name: ${docker.edu_sharing.community.common.varnish.exporter.name}
      ## @param sidecar.proxyMetrics.image.tag Set proxyMetrics sidecar image tag
      tag: ${docker.edu_sharing.community.common.varnish.exporter.tag}

    ## @param sidecar.proxyMetrics.relabelings Set metrics sidecar relabelings
    relabelings: []

    ## @param sidecar.proxyMetrics.startupProbe Optional specs for startupProbe
    startupProbe:

    ## @param sidecar.proxyMetrics.livenessProbe Optional specs for livenessProbe
    livenessProbe:

    ## @param sidecar.proxyMetrics.readinessProbe Optional specs for readinessProbe
    readinessProbe:

    resources:

      limits:
        ## @param sidecar.proxyMetrics.resources.limits.cpu Set CPU limit on resources
        cpu: 250m
        ## @param sidecar.proxyMetrics.resources.limits.memory Set memory limit on resources
        memory: 1Gi
      requests:
        ## @param sidecar.proxyMetrics.resources.requests.cpu Set CPU for requests on resources
        cpu: 250m
        ## @param sidecar.proxyMetrics.resources.requests.memory Set memory for requests on resources
        memory: 1Gi

    securityContext:
      ## @param sidecar.proxyMetrics.securityContext.allowPrivilegeEscalation Allow privilege escalation
      allowPrivilegeEscalation: false
      capabilities:
        ## @param sidecar.proxyMetrics.securityContext.capabilities.drop Set drop capabilities
        drop:
          - ALL
      ## @param sidecar.proxyMetrics.securityContext.runAsUser Define user to run under
      runAsUser: 101

