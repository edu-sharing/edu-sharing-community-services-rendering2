{{- range $roleName, $roleCfg := .Values.roles }}
{{- if $roleCfg.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}
  labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
spec:
  replicas: {{ $roleCfg.replicaCount }}
  selector:
    matchLabels: {{ include "edusharing_common_lib.labels.app" $ | nindent 6 }}
      role: {{ $roleName }}
  serviceName: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}-headless
  template:
    metadata:
      labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 8 }}
        role: {{ $roleName }}
      annotations:
        checksum/configmap-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") $ | sha256sum | trunc 63 }}
        checksum/configmap-file: {{ include (print $.Template.BasePath "/configmap-file.yaml") $ | sha256sum | trunc 63 }}
        checksum/secret-env: {{ include (print $.Template.BasePath "/secret-env.yaml") $ | sha256sum | trunc 63 }}
        {{- if not $.Values.global.metrics.servicemonitor.enabled }}
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "9080"
        prometheus.io/scrape: "true"
        {{- end }}
        sidecar.istio.io/inject: {{ $.Values.global.cluster.istio.enabled | quote }}
        {{- with merge $.Values.podAnnotations $.Values.global.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
      - name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}
        image: {{ include "edusharing_common_lib.images.image" $ }}{{ $.Values.image.name }}:{{ $.Values.image.tag }}
        imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
        env:
        - name: APP_ROLES
          value: {{ $roleCfg.appRoles | quote }}
        {{- /* Per-role heap sizing: role jvm.ram wins, global config.jvm.ram fills gaps. Explicit env overrides the ConfigMap's JAVA_OPTS. */}}
        {{- $ram := $.Values.config.jvm.ram }}
        {{- with $roleCfg.jvm }}{{- with .ram }}{{- $ram = merge (deepCopy .) $.Values.config.jvm.ram }}{{- end }}{{- end }}
        - name: JAVA_OPTS
          value: {{ include "edusharing_services_rendering.javaOpts" (dict "minPercentage" $ram.minPercentage "maxPercentage" $ram.maxPercentage "debug" (default $.Values.global.debug $.Values.debug)) | quote }}
        envFrom:
        - configMapRef:
            name: {{ include "edusharing_common_lib.names.name" $ }}-env
        - secretRef:
            name: {{ include "edusharing_common_lib.names.name" $ }}-env
        ports:
        - name: api
          containerPort: 8080
        - name: management
          containerPort: 9080
        {{- if default $.Values.global.debug $.Values.debug }}
        - name: jpda
          containerPort: 5005
        {{- end }}
        {{- if $.Values.persistence.data.temp.create }}
        volumeMounts:
        - name: temp
          mountPath: /tmp
        {{- end }}
        {{- with $.Values.startupProbe }}
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.livenessProbe }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.readinessProbe }}
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $roleCfg.resources | default $.Values.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with $.Values.securityContext }}
        securityContext: {{ toYaml . | nindent 10 }}
        {{- end }}
      {{ if $.Values.proxy.enabled }}
      - name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}-proxy
        image: {{ include "edusharing_common_lib.images.common" $ }}{{ $.Values.sidecar.proxyCache.image.name }}:{{ $.Values.sidecar.proxyCache.image.tag }}
        imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
        args:
          - '-F'
          - '-f'
          - /etc/varnish/default.vcl
          - '-T'
          - 127.0.0.1:6082
          - '-a'
          - 0.0.0.0:6081
        ports:
          - name: api-proxy
            containerPort: 6081
        volumeMounts:
          - name: file
            mountPath: /etc/varnish/default.vcl
            subPath: proxy-config
          - name: temp-proxy
            mountPath: /var/lib/varnish
        {{- with $.Values.sidecar.proxyCache.startupProbe }}
        startupProbe:
          httpGet:
            path: /health/ready
            port: api-proxy
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.sidecar.proxyCache.livenessProbe }}
        livenessProbe:
          exec:
            command:
              - /usr/bin/varnishadm
              - ping
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: 1
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.sidecar.proxyCache.readinessProbe }}
        readinessProbe:
          httpGet:
            path: /health/ready
            port: api-proxy
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.sidecar.proxyCache.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with $.Values.sidecar.proxyCache.securityContext }}
        securityContext: {{ toYaml . | nindent 10 }}
        {{- end }}
      - name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}-proxy-metrics
        image: {{ include "edusharing_common_lib.images.common" $ }}{{ $.Values.sidecar.proxyMetrics.image.name }}:{{ $.Values.sidecar.proxyMetrics.image.tag }}
        imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
        ports:
          - name: metrics-proxy
            containerPort: 9131
        volumeMounts:
          - name: file
            mountPath: /etc/varnish/default.vcl
            subPath: proxy-config
          - name: temp-proxy
            mountPath: /var/lib/varnish
        {{- with $.Values.sidecar.proxyMetrics.startupProbe }}
        startupProbe:
          exec:
            command:
              - "/bin/sh"
              - "-c"
              - "echo startupProbe > /dev/null"
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.sidecar.proxyMetrics.livenessProbe }}
        livenessProbe:
          exec:
            command:
              - "/bin/sh"
              - "-c"
              - "echo livenessProbe > /dev/null"
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.sidecar.proxyMetrics.readinessProbe }}
        readinessProbe:
          exec:
            command:
              - "/bin/sh"
              - "-c"
              - "echo readinessProbe > /dev/null"
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with $.Values.sidecar.proxyMetrics.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with $.Values.sidecar.proxyMetrics.securityContext }}
        securityContext: {{ toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with $.Values.global.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with merge $.Values.podSecurityContext $.Values.global.security }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{ with $.Values.terminationGracePeriod }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if or $.Values.nodeAffinity $.Values.podAntiAffinity }}
      affinity:
        {{- with $.Values.nodeAffinity }}
        nodeAffinity: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- if $.Values.podAntiAffinity }}
        podAntiAffinity:
          {{- if eq $.Values.podAntiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: {{ include "edusharing_common_lib.labels.app" $ | nindent 16 }}
          {{- else if eq $.Values.podAntiAffinity "soft" }}
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {{ include "edusharing_common_lib.labels.app" $ | nindent 18 }}
          {{- end }}
        {{- end }}
      {{- end }}
      volumes:
      - name: file
        configMap:
          name: {{ include "edusharing_common_lib.names.name" $ }}-file
      {{- if $.Values.proxy.enabled }}
      - name: temp-proxy
        emptyDir: { }
      {{- end }}
  {{- if $.Values.persistence.data.temp.create }}
  volumeClaimTemplates:
  - metadata:
      name: temp
      labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 8 }}
    spec: {{ merge $.Values.persistence.data.temp.spec $.Values.global.cluster.storage.data.spec | toYaml | nindent 6 }}
  {{- end }}
---
{{- end }}
{{- end }}
