apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-env
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
data:
  {{- /* Global default; per-role JAVA_OPTS in statefulset.yaml overrides this via explicit env. */}}
  JAVA_OPTS: {{ include "edusharing_services_rendering.javaOpts" (dict "minPercentage" .Values.config.jvm.ram.minPercentage "maxPercentage" .Values.config.jvm.ram.maxPercentage "debug" (default .Values.global.debug .Values.debug)) | quote }}
  SPRING_APPLICATION_JSON: {{ .Values.config.override | quote }}
  S3_HOST: {{ .Values.config.s3.host | quote }}
  S3_PORT: {{ .Values.config.s3.port | quote }}
  RABBITMQ_HOST: {{ .Values.config.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.config.rabbitmq.port | quote }}
  {{- range $q, $v := .Values.config.queue.concurrency }}
  "app.queue.{{ $q }}.concurrency": {{ $v | quote }}
  {{- end }}
  {{- with .Values.config.queue.prefetch }}
  "app.queue.prefetch": {{ . | quote }}
  {{- end }}
  {{- range $q, $v := .Values.config.queue.remotePrefetch }}
  {{- with $v }}
  "app.queue.{{ $q }}.prefetch": {{ . | quote }}
  {{- end }}
  {{- end }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  MONGODB_HOST: {{ (printf "%s-0" .Values.config.mongodb.host) | quote }}
  MONGODB_PORT: {{ .Values.config.mongodb.port | quote }}
  "server.servlet.context-path": {{ .Values.ingress.paths | first | quote }}
  "app.appId": {{ .Values.config.home.appid | quote }}
  "app.public.protocol": {{ ternary "http" "https" (empty .Values.ingress.tls) | quote }}
  "app.public.host": {{ .Values.ingress.hosts | first | quote }}
  "app.public.port": {{ ternary "80" "443" (empty .Values.ingress.tls) | quote }}
  "app.public.path": {{ .Values.ingress.paths | first | quote }}
  "app.internal.protocol": http
  "app.internal.host": {{ include "edusharing_common_lib.names.name" . }}
  "app.internal.path": {{ .Values.ingress.paths | first | quote }}
  "app.internal.port": "8080"
  "app.s3.region": {{ .Values.config.s3.region | quote }}
  "app.s3.protocol": {{ .Values.config.s3.protocol | quote }}
  "app.s3.bucket.mode": {{ .Values.config.s3.mode | quote }}
  "app.s3.trustAllCertificates": {{ .Values.config.s3.trustAllCertificates | quote }}
  "app.s3.checksumCalculationWhenRequired": {{ .Values.config.s3.checksumCalculationWhenRequired | quote }}
  "app.session.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.default | quote }}
  "app.session.image.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.image | quote }}
  "app.session.audio.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.audio | quote }}
  "app.session.video.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.video | quote }}
  "app.session.pdf.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.pdf | quote }}
  "app.session.moodle.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.moodle | quote }}
  "app.session.scorm.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.scorm | quote }}
  "app.session.eduHtml.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.eduhtml | quote }}
  "app.session.document.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.document | quote }}
  "app.session.spreadsheet.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.spreadsheet | quote }}
  "app.session.html.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.html | quote }}
  "app.session.h5p.nodePermissionExpirationTime": {{ .Values.config.session.nodePermissionExpirationTime.h5p | quote }}
  "app.converter.image.format": {{ .Values.config.converter.image.format | quote }}
  "app.converter.image.mimeTypes": {{ .Values.config.converter.image.mimetypes | quote }}
  "app.converter.image.sizes": {{ .Values.config.converter.image.sizes | quote }}
  "app.converter.image.maxPixels": {{ .Values.config.converter.image.maxPixels | quote }}
  "app.converter.video.format": {{ .Values.config.converter.video.format | quote }}
  "app.converter.video.ffmpegThreads": {{ .Values.config.converter.video.ffmpegThreads | quote }}
  "app.converter.video.ffmpegPreset": {{ .Values.config.converter.video.ffmpegPreset | quote }}
  "app.converter.video.mimeTypes": {{ .Values.config.converter.video.mimetypes | quote }}
  "app.converter.video.resolutions": {{ .Values.config.converter.video.resolutions | quote }}
  "app.converter.audio.mimeTypes": {{ .Values.config.converter.audio.mimetypes | quote }}
  "app.converter.audio.bitrate": {{ .Values.config.converter.audio.bitrate | quote }}
  "app.converter.audio.ffmpegThreads": {{ .Values.config.converter.audio.ffmpegThreads | quote }}
  "app.converter.av.ffmpegPath": {{ .Values.config.converter.av.ffmpegPath | quote }}
  "app.cache.cleaner.schedule": {{ .Values.config.cache.cleaner.schedule | quote }}
  "app.cache.cleaner.threshold.lower": {{ .Values.config.cache.cleaner.threshold.lower | quote }}
  "app.cache.cleaner.threshold.upper": {{ .Values.config.cache.cleaner.threshold.upper | quote }}
  "app.jobreaper.enabled": {{ .Values.config.jobreaper.enabled | quote }}
  "app.jobreaper.schedule": {{ .Values.config.jobreaper.schedule | quote }}
  "app.jobreaper.default-max-process-time": {{ .Values.config.jobreaper.defaultMaxProcessTime | quote }}
  {{- range $k, $v := .Values.config.jobreaper.maxProcessTime }}
  "app.jobreaper.max-process-time.{{ $k }}": {{ $v | quote }}
  {{- end }}
  "app.lumi.host": {{ printf "http://%s:%d" .Values.config.lumi.host (.Values.config.lumi.port | int) | quote }}
  "app.documentConverter.host": {{ printf "http://%s:%d" .Values.config.converter.document.host (.Values.config.converter.document.port | int) | quote }}
  "app.jupyterConverter.host": {{ printf "http://%s:%d" .Values.config.converter.jupyter.host (.Values.config.converter.jupyter.port | int) | quote }}
  "spring.http.codecs.max-in-memory-size": {{ .Values.config.webclient.codec.maxInMemorySize | quote }}
  "spring.redis.cluster.nodes": {{ (printf "%s:%d" .Values.config.redis.host (.Values.config.redis.port | int)) | quote }}
  "spring.redis.cluster.maxRedirects": "5"
  "spring.redis.cluster.keyPrefix": {{ printf "%s:" (include "edusharing_common_lib.names.name" .) | quote }}
  "server.servlet.session.cookie.same-site": {{ .Values.config.session.cookie.samesite | quote}}
  "server.servlet.session.cookie.secure": {{ .Values.config.session.cookie.secure | quote}}
  "server.servlet.session.cookie.partitioned": {{ .Values.config.session.cookie.partitioned | quote}}
  {{- range $register := .Values.config.home.registrations }}
  {{- $modules := list -}}
  {{- range $module := $register.modules }}
  {{- $modules = append $modules $module.name }}
  {{- with $module.cspHeader }}
  "app.repository.registration.id.{{ $register.id }}.module.{{ $module.name }}.cspHeader": {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- range $bucket := $register.buckets }}
  "app.repository.registration.id.{{ $register.id }}.externalBuckets.{{ $bucket.name }}.name": {{ $bucket.value | quote }}
  {{- with $bucket.quota }}
  {{/* Quota may be a plain byte count or a human-readable size (e.g. "10GB", accepted by the app's
       @DataSizeUnit-annotated config binding). A human-readable value already arrives as a Go
       string (YAML has no numeric syntax for it) and must pass through unchanged. A plain number,
       though, decodes as float64 (sigs.k8s.io/yaml -> JSON -> interface{}), so a bare `quote` on a
       multi-GB byte value would render scientific notation (e.g. "1.073741824e+10") — `int64` forces
       a proper integer round-trip first. */}}
  {{- if kindIs "string" . }}
  "app.repository.registration.id.{{ $register.id }}.externalBuckets.{{ $bucket.name }}.quota": {{ . | quote }}
  {{- else }}
  "app.repository.registration.id.{{ $register.id }}.externalBuckets.{{ $bucket.name }}.quota": {{ . | int64 | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  "app.repository.registration.id.{{ $register.id }}.optional-modules": {{ join "," $modules | quote }}
  {{- $quota := $register.quota | default 0 }}
  {{/* Same human-readable-size-vs-float64 handling as the bucket quota above. */}}
  {{- if kindIs "string" $quota }}
  "app.repository.registration.id.{{ $register.id }}.quota": {{ $quota | quote }}
  {{- else }}
  "app.repository.registration.id.{{ $register.id }}.quota": {{ $quota | int64 | quote }}
  {{- end }}
  "app.repository.registration.id.{{ $register.id }}.url": {{ $register.url | quote }}
  {{- end }}
