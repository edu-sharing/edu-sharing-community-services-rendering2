apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-env
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
type: Opaque
data:
  "app.s3.accessKeyId": {{ .Values.config.s3.username | b64enc | quote }}
  "app.s3.secretAccessKey": {{ default .Values.global.password .Values.config.s3.password | b64enc | quote }}
  "spring.rabbitmq.username": {{ .Values.config.rabbitmq.username | b64enc | quote }}
  "spring.rabbitmq.password": {{ default .Values.global.password .Values.config.rabbitmq.password | b64enc | quote }}
  {{- range $register := .Values.config.home.registrations }}
  {{- $id := include "edusharing_services_rendering.registrationId" $register.id }}
  {{- range $module := $register.modules }}
  {{- range $credential := $module.credentials }}
  "app.repository.registration.id.{{ $id }}.module.{{ $module.name }}.credentials.{{ $credential.name }}": {{ $credential.value | b64enc | quote }}
  {{- end }}
  {{- end }}
  "app.repository.registration.id.{{ $id }}.username": {{ $register.username | b64enc | quote }}
  "app.repository.registration.id.{{ $id }}.password": {{ (default $.Values.global.password $register.password) | b64enc | quote}}
  {{- end }}
  "app.security.adminPassword": {{ default .Values.global.password .Values.config.admin.password | b64enc | quote }}
  {{- $mongodb := .Values.config.mongodb }}
  {{- $mongodbPort := $mongodb.port | int }}
  {{- $mongodbReplicas := $mongodb.replicas | int }}
  {{- $mongodbHosts := list }}
  {{- if gt $mongodbReplicas 1 }}
  {{- range $index := until $mongodbReplicas }}
  {{- $mongodbHosts = append $mongodbHosts (printf "%s-%d:%d" $mongodb.host $index $mongodbPort) }}
  {{- end }}
  {{- else }}
  {{- $mongodbHosts = append $mongodbHosts (printf "%s:%d" $mongodb.host $mongodbPort) }}
  {{- end }}
  {{- $mongodbOptions := "" }}
  {{- if $mongodb.authSource }}
  {{- $mongodbOptions = printf "?authSource=%s" ($mongodb.authSource | urlquery) }}
  {{- end }}
  "spring.mongodb.uri": {{ (printf "mongodb://%s:%s@%s/%s%s" $mongodb.username ((default .Values.global.password $mongodb.password) | urlquery | replace "+" "%20") (join "," $mongodbHosts) $mongodb.database $mongodbOptions) | b64enc | quote }}
