apiVersion: v1
kind: Service
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
    role: {{ .Values.roleForInternalUse }}
  ports:
  - name: http-api
    port: {{ .Values.service.port.api }}
    targetPort: api
---
{{- range $roleName, $roleCfg := .Values.roles }}
{{- if $roleCfg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}
  labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
spec:
  type: ClusterIP
  selector: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
  ports:
  - name: http-api
    port: {{ $.Values.service.port.api }}
    targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}-headless
  labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
  ports:
  - name: http-api
    port: {{ $.Values.service.port.api }}
---
{{- if $.Values.global.metrics.servicemonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}-metrics-api
  labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
    app.kubernetes.io/component: "metrics-api"
spec:
  type: ClusterIP
  selector: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
  ports:
    - name: http-management
      port: {{ $.Values.service.port.metrics.api }}
      targetPort: management
---
{{- if $.Values.proxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edusharing_common_lib.names.name" $ }}-{{ $roleName }}-metrics-proxy
  labels: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
    app.kubernetes.io/component: "metrics-proxy"
spec:
  type: ClusterIP
  selector: {{ include "edusharing_common_lib.labels.app" $ | nindent 4 }}
    role: {{ $roleName }}
  ports:
    - name: http-metrics-proxy
      port: {{ $.Values.service.port.metrics.proxy }}
      targetPort: metrics-proxy
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
