########################################################################################################################
# LOCAL
########################################################################################################################

## @section Local parameters
## @param nameOverride Override name
nameOverride: edusharing-services-rendering2

########################################################################################################################
# DEPENDENCY
########################################################################################################################

edusharing_services_rendering2_minio:

  ## @param edusharing_services_rendering2_minio.enabled Enable minio
  enabled: true

  ## @param edusharing_services_rendering2_minio.nameOverride Override minio name
  nameOverride: &minioNameOverride edusharing-services-rendering2-minio

  image:
    ## @param edusharing_services_rendering2_minio.image.name Set minio image name
    name: ${docker.edu_sharing.community.common.minio.name}
    ## @param edusharing_services_rendering2_minio.image.tag Set minio image tag
    tag: ${docker.edu_sharing.community.common.minio.tag}

  service:

    port:
      ## @param edusharing_services_rendering2_minio.service.port.api Set minio service api port
      api: &minioServicePortApi 9000

  config:

    buckets:
      ## @param edusharing_services_rendering2_minio.config.buckets[0].name Set minio bucket
      - name: &minioConfigBucketContent lumi-contentbucket
      ## @param edusharing_services_rendering2_minio.config.buckets[1].name Set minio bucket
      - name: &minioConfigBucketLib lumi-libbucket
      ## @param edusharing_services_rendering2_minio.config.buckets[2].name Set minio bucket
      - name: &minioConfigBucketTemp lumi-tempbucket

    ## @param edusharing_services_rendering2_minio.config.username Set minio username
    username: &minioConfigUsername rendering2

  init:

    permission:

      image:
        ## @param edusharing_services_rendering2_minio.init.permission.image.name Set minio init permission image name
        name: ${docker.edu_sharing.community.common.minideb.name}
        ## @param edusharing_services_rendering2_minio.init.permission.image.tag Set minio init permission image tag
        tag: ${docker.edu_sharing.community.common.minideb.tag}

  job:

    provisioning:

      init:

        wait:

          image:
            ## @param edusharing_services_rendering2_minio.job.provisioning.init.wait.image.name Set wait container image name
            name: ${docker.edu_sharing.community.common.minideb.name}
            ## @param edusharing_services_rendering2_minio.job.provisioning.init.wait.image.tag Set wait container image tag
            tag: ${docker.edu_sharing.community.common.minideb.tag}

      image:
        ## @param edusharing_services_rendering2_minio.job.provisioning.image.name Set job image name
        name: ${docker.edu_sharing.community.common.minio.name}
        ## @param edusharing_services_rendering2_minio.job.provisioning.image.tag Set job image tag
        tag: ${docker.edu_sharing.community.common.minio.tag}

########################################################################################################################

edusharing_services_rendering2_mongodb:

  ## @param edusharing_services_rendering2_mongodb.enabled Enable mongodb
  enabled: true

  ## @param edusharing_services_rendering2_mongodb.nameOverride Override mongodb name
  nameOverride: &mongoNameOverride edusharing-services-rendering2-mongodb

  image:
    ## @param edusharing_services_rendering2_mongodb.image.name Set mongodb image name
    name: ${docker.edu_sharing.community.common.mongodb.name}
    ## @param edusharing_services_rendering2_mongodb.image.tag Set mongodb image tag
    tag: ${docker.edu_sharing.community.common.mongodb.tag}

  service:
    port:
      ## @param edusharing_services_rendering2_mongodb.service.port.api Set mongodb service api port
      api: &mongoServicePortApi 27017

  config:
    ## @param edusharing_services_rendering2_mongodb.config.database Set mongodb database
    database: &mongoConfigDatabase rendering2
    ## @param edusharing_services_rendering2_mongodb.config.username Set mongodb username
    username: &mongoConfigUsername rendering2

  init:

    permission:

      image:
        ## @param edusharing_services_rendering2_mongodb.init.permission.image.name Set mongodb init permission image name
        name: ${docker.edu_sharing.community.common.minideb.name}
        ## @param edusharing_services_rendering2_mongodb.init.permission.image.tag Set mongodb init permission image tag
        tag: ${docker.edu_sharing.community.common.minideb.tag}

  job:

    dump:

      image:
        ## @param edusharing_services_rendering2_mongodb.job.dump.image.name Set mongodb dump job image name
        name: ${docker.edu_sharing.community.common.mongodb.name}
        ## @param edusharing_services_rendering2_mongodb.job.dump.image.tag Set mongodb dump job image tag
        tag: ${docker.edu_sharing.community.common.mongodb.tag}

  sidecar:

    metrics:

      image:
        ## @param edusharing_services_rendering2_mongodb.sidecar.metrics.image.name Set metrics sidecar image name
        name: ${docker.edu_sharing.community.common.mongodb.exporter.name}
        ## @param edusharing_services_rendering2_mongodb.sidecar.metrics.image.tag Set metrics sidecar image tag
        tag: ${docker.edu_sharing.community.common.mongodb.exporter.tag}

