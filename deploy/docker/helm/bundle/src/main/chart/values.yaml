edusharing_services_rendering2_document_converter:

  ## @param edusharing_services_rendering2_document_converter.enabled Enable rendering2 document converter
  enabled: true

########################################################################################################################

edusharing_services_rendering2_lumi:

  ## @param edusharing_services_rendering2_lumi.enabled Enable rendering2 lumi
  enabled: true

  config:

    mongodb:
      ## @param edusharing_services_rendering2_lumi.config.mongodb.host Set mongodb host
      host: *mongoLumiNameOverride
      ## @param edusharing_services_rendering2_lumi.config.mongodb.port Set mongodb port
      port: *mongoLumiServicePortApi
      ## @param edusharing_services_rendering2_lumi.config.mongodb.username Set mongodb username
      username: *mongoLumiConfigUsername
      ## @param edusharing_services_rendering2_lumi.config.mongodb.database Set mongodb database
      database: *mongoLumiConfigDatabase


    s3:
      ## @param edusharing_services_rendering2_lumi.config.s3.host Set S3 host
      host: *minioNameOverride
      ## @param edusharing_services_rendering2_lumi.config.s3.port Set S3 port
      port: *minioServicePortApi
      ## @param edusharing_services_rendering2_lumi.config.s3.username Set S3 username
      username: *minioConfigUsername

      buckets:
        ## @param edusharing_services_rendering2_lumi.config.s3.buckets.content Set S3 bucket for content
        content: *minioConfigBucketContent
        ## @param edusharing_services_rendering2_lumi.config.s3.buckets.library Set S3 bucket for library
        library: *minioConfigBucketLib
        ## @param edusharing_services_rendering2_lumi.config.s3.buckets.temporary Set S3 bucket for temporary
        temporary: *minioConfigBucketTemp

########################################################################################################################

edusharing_services_rendering2_service:

  ## @param edusharing_services_rendering2_service.enabled Enable rendering2 service
  enabled: true

  config:

    mongodb:
      ## @param edusharing_services_rendering2_service.config.mongodb.host Set mongodb host
      host: *mongoNameOverride
      ## @param edusharing_services_rendering2_service.config.mongodb.port Set mongodb port
      port: *mongoServicePortApi
      ## @param edusharing_services_rendering2_service.config.mongodb.username Set mongodb username
      username: *mongoConfigUsername
      ## @param edusharing_services_rendering2_service.config.mongodb.database Set mongodb database
      database: *mongoConfigDatabase

    rabbitmq:
      ## @param edusharing_services_rendering2_service.config.rabbitmq.host Set rabbitmq host
      host: *rabbitmqNameOverride
      ## @param edusharing_services_rendering2_service.config.rabbitmq.port Set rabbitmq port
      port: *rabbitmqServicePortAmqp
      ## @param edusharing_services_rendering2_service.config.rabbitmq.username Set rabbitmq username
      username: *rabbitmqConfigUsername

    redis:
      ## @param edusharing_services_rendering2_service.config.redis.host Set redis host
      host: *redisclusterNameOverride
      ## @param edusharing_services_rendering2_service.config.redis.port Set redis port
      port: *redisclusterServicePortApi

    s3:
      ## @param edusharing_services_rendering2_service.config.s3.host Set S3 host
      host: *minioNameOverride
      ## @param edusharing_services_rendering2_service.config.s3.port Set S3 port
      port: *minioServicePortApi
      ## @param edusharing_services_rendering2_service.config.s3.username Set S3 username
      username: *minioConfigUsername

