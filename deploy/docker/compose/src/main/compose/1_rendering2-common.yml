version: '3.7'

services:

  rendering2-rustfs-storage:
    image: "${docker.registry}/${docker.common}/${docker.edu_sharing.community.common.rustfs.name}:${docker.edu_sharing.community.common.rustfs.tag}"
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: "${RENDERING2_S3_STORAGE_USER:-rendering2}"
      RUSTFS_SECRET_KEY: "${RENDERING2_S3_STORAGE_PASSWORD:-rendering2}"
      RUST_BACKTRACE: full
    command: [ "rustfs" ]
    volumes:
      - "rendering2-rustfs-storage-volume-data:/data"
    expose:
      - 9000
      - 9001
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_RUSTFS_STORAGE_PORT_HTTP:-10201}:9001"

  rendering2-message-queue:
    image: "${docker.registry}/${docker.common}/${docker.edu_sharing.community.common.rabbitmq.name}:${docker.edu_sharing.community.common.rabbitmq.tag}"
    environment:
      RABBITMQ_DEFAULT_USER: "${RENDERING2_MESSAGE_QUEUE_USER:-rendering}"
      RABBITMQ_DEFAULT_PASS: "${RENDERING2_MESSAGE_QUEUE_PASSWORD:-rendering}"
      RABBITMQ_SECURE_PASSWORD: true
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: true
    expose:
      - "5672"
      - "15672"
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_MESSAGE_QUEUE_PORT_HTTP:-10300}:15672"

  mongo-database:
    environment:
      MONGODB_EXTRA_RENDERING2_DATABASE: "${RENDERING2_SERVICE_DATABASE_NAME:-rendering}"
      MONGODB_EXTRA_RENDERING2_USERNAME: "${RENDERING2_SERVICE_DATABASE_USER:-rendering}"
      MONGODB_EXTRA_RENDERING2_PASSWORD: "${RENDERING2_SERVICE_DATABASES_PASS:-rendering}"
      MONGODB_EXTRA_LUMI_DATABASE: "${RENDERING2_LUMI_DATABASE_NAME:-lumi}"
      MONGODB_EXTRA_LUMI_USERNAME: "${RENDERING2_LUMI_DATABASE_USER:-lumi}"
      MONGODB_EXTRA_LUMI_PASSWORD: "${RENDERING2_LUMI_DATABASE_PASS:-lumi}"

  rendering2-service:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-service:${docker.tag}"
    command:
      - -Xms${RENDERING2_SERVICE_JAVA_XMS:-512m}
      - -Xmx${RENDERING2_SERVICE_JAVA_XMX:-512m}
      - -Dcom.sun.management.jmxremote
      - -Dcom.sun.management.jmxremote.authenticate=false
      - -Dcom.sun.management.jmxremote.port=7199
      - -Dcom.sun.management.jmxremote.ssl=false
    environment:
      S3_HOST: "${RENDERING2_S3_STORAGE_HOST:-rendering2-rustfs-storage}"
      S3_PORT: "${RENDERING2_S3_STORAGE_PORT:-9000}"
      app.s3.accessKeyId: "${RENDERING2_S3_STORAGE_USER:-rendering2}"
      app.s3.secretAccessKey: "${RENDERING2_S3_STORAGE_PASSWORD:-rendering2}"
      app.s3.region: eu-central-1
      app.s3.protocol: "${RENDERING2_S3_STORAGE_PROTOCOL:-http}"
      app.s3.bucket.mode: "${RENDERING2_S3_BUCKET_MODE:-byType}"
      app.s3.trustAllCertificates: false
      app.s3.checksumCalculationWhenRequired: false
      RABBITMQ_HOST: rendering2-message-queue
      RABBITMQ_PORT: 5672
      # Per-queue consumer count for the DirectMessageListenerContainer (consumersPerQueue): how many
      # consumers are registered at the broker per queue. A burst is fanned out to all of them at once
      # (no auto-scale ramp); idle consumers cost nothing (shared virtual-thread executor). Size the
      # CPU-in-JVM queues (image, eduHtml) and ffmpeg (av) against cores; pure-wait queues can go higher.
      app.queue.job.consumersPerQueue: "${RENDERING2_QUEUE_JOB_CONSUMERS:-20}"
      app.queue.image.consumersPerQueue: "${RENDERING2_QUEUE_IMAGE_CONSUMERS:-4}"
      app.queue.av.consumersPerQueue: "${RENDERING2_QUEUE_AV_CONSUMERS:-2}"
      app.queue.moodle.consumersPerQueue: "${RENDERING2_QUEUE_MOODLE_CONSUMERS:-1}"
      app.queue.eduHtml.consumersPerQueue: "${RENDERING2_QUEUE_EDUHTML_CONSUMERS:-5}"
      app.queue.document.consumersPerQueue: "${RENDERING2_QUEUE_DOCUMENT_CONSUMERS:-8}"
      app.queue.jupyter.consumersPerQueue: "${RENDERING2_QUEUE_JUPYTER_CONSUMERS:-8}"
      # Import queues (sodix, omega, ddb) are DECOUPLED: one consumer/channel per pod, concurrency comes
      # from app.module.<x>.import.concurrency on virtual threads. Keep at 1 and scale via pods, not consumers.
      app.queue.sodix.consumersPerQueue: "${RENDERING2_QUEUE_SODIX_CONSUMERS:-1}"
      app.queue.omega.consumersPerQueue: "${RENDERING2_QUEUE_OMEGA_CONSUMERS:-1}"
      app.queue.binder.consumersPerQueue: "${RENDERING2_QUEUE_BINDER_CONSUMERS:-1}"
      app.queue.binderPreview.consumersPerQueue: "${RENDERING2_QUEUE_BINDER_PREVIEW_CONSUMERS:-1}"
      app.queue.ddb.consumersPerQueue: "${RENDERING2_QUEUE_DDB_CONSUMERS:-1}"
      app.queue.onyx.consumersPerQueue: "${RENDERING2_QUEUE_ONYX_CONSUMERS:-8}"
      # Unacked messages buffered per consumer (broker round-trip amortization); one global default.
      app.queue.prefetch: "${RENDERING2_QUEUE_PREFETCH:-1}"
      # Per-pod import concurrency K, per import queue (sodix/omega/ddb): the single import consumer
      # processes up to K messages in parallel on virtual threads. `concurrency` sizes both the dedicated
      # import HTTP pool (Reactor Netty maxConnections, per remote host) and the broker prefetch, so the
      # two stay aligned per queue. Scale total throughput via converter pods, not by raising K.
      app.module.sodix.import.concurrency: "${RENDERING2_IMPORT_SODIX_CONCURRENCY:-50}"
      app.module.omega.import.concurrency: "${RENDERING2_IMPORT_OMEGA_CONCURRENCY:-50}"
      app.module.ddb.import.concurrency: "${RENDERING2_IMPORT_DDB_CONCURRENCY:-50}"
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      MONGODB_HOST: mongo-database
      MONGODB_PORT: 27017
      VIRTUAL_HOST: "${RENDERING2_SERVICE_PUBLIC_HOST:-repository.127.0.0.1.nip.io}"
      VIRTUAL_PATH: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}/"
      VIRTUAL_PORT: 8080
      server.servlet.context-path: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      app.appId: rendering2
      app.security.enabled: true
      app.public.protocol: "${RENDERING2_SERVICE_PUBLIC_PROTOCOL:-http}"
      app.public.host: "${RENDERING2_SERVICE_PUBLIC_HOST:-repository.127.0.0.1.nip.io}"
      app.public.port: "${RENDERING2_SERVICE_PUBLIC_PORT:-80}"
      app.public.path: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      app.internal.protocol: http
      app.internal.host: rendering2-service
      app.internal.path: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      app.internal.port: 8080
      app.session.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_NODE_PERMISSION_EXPIRATION_TIME:-60}"
      app.session.image.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_IMAGE_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.audio.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_AUDIO_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.video.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_VIDEO_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.pdf.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_PDF_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.moodle.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_MOODLE_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.scorm.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_SCORM_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.eduHtml.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_EDUHTML_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.document.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_DOCUMENT_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.spreadsheet.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_SPREADSHEET_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.html.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_HTML_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.h5p.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_H5P_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.converter.image.format: "${RENDERING2_SERVICE_CONVERTER_IMAGE_FORMAT:-jpeg}"
      app.converter.image.mimeTypes: "${RENDERING2_SERVICE_CONVERTER_IMAGE_MIME_TYPES:-image/vnd.wap.wbmp,image/png,image/x-png,image/jpeg,image/tiff,image/bmp,image/gif,image/x-webp,image/webp}"
      app.converter.image.sizes: "${RENDERING2_SERVICE_CONVERTER_IMAGE_SIZES:-800,1280,1920}"
      app.converter.image.maxPixels: "${RENDERING2_SERVICE_CONVERTER_IMAGE_MAX_PIXELS:-100000000}"
      app.converter.video.format: "${RENDERING2_SERVICE_CONVERTER_VIDEO_FORMAT:-mp4}"
      app.converter.video.ffmpegThreads: "${RENDERING2_SERVICE_CONVERTER_VIDEO_FFMPEG_THREADS:-4}"
      app.converter.video.ffmpegPreset: "${RENDERING2_SERVICE_CONVERTER_VIDEO_FFMPEG_PRESET:-veryfast}"
      app.converter.video.mimeTypes: "${RENDERING2_SERVICE_CONVERTER_VIDEO_MIME_TYPES:-video/mp4,video/mpeg,video/quicktime,video/x-msvideo,video/vnd.avi,video/avi,video/x-flv,video/x-matroska,video/ogg,video/x-ms-wmv,video/theora}"
      app.converter.video.resolutions: "${RENDERING2_SERVICE_CONVERTER_VIDEO_RESOLUTIONS:-480,720,1080}"
      app.converter.audio.mimeTypes: "${RENDERING2_SERVICE_CONVERTER_AUDIO_MIME_TYPES:-audio/mpeg,audio/mp4,audio/vnd.wav,audio/ogg,audio/vorbis,audio/wav,audio/x-wav,audio/x-ms-wma}"
      app.converter.audio.bitrate: "${RENDERING2_SERVICE_CONVERTER_AUDIO_BITRATE:-160}"
      app.cache.cleaner.schedule: "${RENDERING2_SERVICE_CACHE_CLEANER_SCHEDULE:-0 0 1 * * *}"
      app.cache.cleaner.threshold.lower: "${RENDERING2_SERVICE_CACHE_CLEANER_THRESHOLD_LOWER:-0.7}"
      app.cache.cleaner.threshold.upper: "${RENDERING2_SERVICE_CACHE_CLEANER_THRESHOLD_UPPER:-0.9}"
      # Stale-job reaper (master only): times out orphaned PROCESSING sub-jobs (crashed/lost conversions)
      # so they cannot poison re-rendering until the 8-day TTL. schedule = fixed delay between runs in ms;
      # max-process-time per routing key (ISO-8601 Duration) must exceed the longest real duration.
      app.jobreaper.enabled: "${RENDERING2_JOBREAPER_ENABLED:-true}"
      app.jobreaper.schedule: "${RENDERING2_JOBREAPER_SCHEDULE:-600000}"
      app.jobreaper.default-max-process-time: "${RENDERING2_JOBREAPER_DEFAULT_MAX_PROCESS_TIME:-PT30M}"
      app.jobreaper.max-process-time.av_job: "${RENDERING2_JOBREAPER_MAX_PROCESS_TIME_AV_JOB:-PT45M}"
      spring.rabbitmq.username: "${RENDERING2_MESSAGE_QUEUE_USER:-rendering}"
      spring.rabbitmq.password: "${RENDERING2_MESSAGE_QUEUE_PASSWORD:-rendering}"
      app.repository.registration.id.local.url: http://repository-service:8080/edu-sharing
      app.repository.registration.id.local.username: admin
      app.repository.registration.id.local.password: "${REPOSITORY_SERVICE_ADMIN_PASS:-admin}"
      app.repository.registration.id.local.optional-modules: H5P,EDUHTML,SPREADSHEET,HTML
      app.repository.registration.id.local.module.MOODLE.credentials.baseurl: "${RENDERING2_MOODLE_URL:-}"
      app.repository.registration.id.local.module.MOODLE.credentials.publicurl: "${RENDERING2_MOODLE_PUBLIC_URL:-}"
      #app.repository.registration.id.local.buckets.renderingBucket: "${RENDERING2_S3_STORAGE_BUCKET:-rendering2}"
      #app.repository.registration.id.local.buckets.tempBucket: "${RENDERING2_S3_TEMP_BUCKET:-temp}"
#      app.repository.registration.id.local.module.MOODLE.credentials.user: user
      app.repository.registration.id.local.module.MOODLE.credentials.token:  "${RENDERING2_MOODLE_TOKEN:-}"
      app.repository.registration.id.local.module.MOODLE.credentials.timeout: "${RENDERING2_MOODLE_TIMEOUT:-90}"
      app.repository.registration.id.local.module.MOODLE.credentials.categoryid: "${RENDERING2_MOODLE_CATEGORY_ID:-1}"
      app.repository.registration.id.local.module.H5P.cspHeader: "${RENDERING2_H5P_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.module.SPREADSHEET.cspHeader: "${RENDERING2_SPREADSHEET_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.module.HTML.cspHeader: "${RENDERING2_HTML_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.module.EDUHTML.cspHeader: "${RENDERING2_HTML_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.externalBuckets.renderingBucket: "${RENDERING2_S3_RENDERING_BUCKET:-}"
      app.repository.registration.id.local.externalBuckets.tempBucket: "${RENDERING2_S3_TEMP_BUCKET:-}"
      app.security.adminPassword: "${RENDERING2_SERVICE_ADMIN_PASSWORD:-admin}"
      spring.http.codecs.max-in-memory-size: "${RENDERING2_SERVICE_MAX_IN_MEMORY_SIZE:-20MB}"
      # The dedicated import HTTP pools (sodix/omega/ddb) are sized per queue via
      # app.module.<x>.import.concurrency above (Reactor Netty maxConnections, per remote host).
      spring.mongodb.authentication-database: "${RENDERING2_SERVICE_DATABASE_NAME:-rendering}"
      spring.mongodb.database: "${RENDERING2_SERVICE_DATABASE_NAME:-rendering}"
      spring.mongodb.username: "${RENDERING2_SERVICE_DATABASE_USER:-rendering}"
      spring.mongodb.password: "${RENDERING2_SERVICE_DATABASES_PASS:-rendering}"
      server.servlet.session.cookie.same-site: "${RENDERING2_SERVICE_COOKIE_SAME_SITE:-Lax}"
      server.servlet.session.cookie.secure: "${RENDERING2_SERVICE_COOKIE_SECURE:-false}"
      server.servlet.session.cookie.partitioned: "${RENDERING2_SERVICE_COOKIE_PARTITIONED:-false}"
      app.lumi.host: http://rendering2-lumi:3000
      app.documentConverter.host: http://rendering2-document-converter:8080
    expose:
      - "8080"
    depends_on:
      - mongo-database
      - rendering2-message-queue
      - redis-cache
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_SERVICE_PORT_HTTP:-10100}:8080"

  rendering2-document-converter:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-document-converter:${docker.tag}"
    command:
      - -Xms${RENDERING2_SERVICE_DOCUMENT_CONVERTER_JAVA_XMS:-512m}
      - -Xmx${RENDERING2_SERVICE_DOCUMENT_CONVERTER_JAVA_XMX:-512m}
      - -Dcom.sun.management.jmxremote
      - -Dcom.sun.management.jmxremote.authenticate=false
      - -Dcom.sun.management.jmxremote.port=7199
      - -Dcom.sun.management.jmxremote.ssl=false
    expose:
      - "8080"

  rendering2-lumi:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-lumi:${docker.tag}"
    environment:
      AWS_ACCESS_KEY_ID: "${RENDERING2_S3_STORAGE_USER:-rendering2}"
      AWS_SECRET_ACCESS_KEY: "${RENDERING2_S3_STORAGE_PASSWORD:-rendering2}"
      AWS_S3_MAX_FILE_LENGTH: "${RENDERING2_LUMI_MAX_FILE_SIZE:-1000}"
      AWS_S3_REGION: eu-central-1
      AWS_S3_TRUST_ALL_CERTIFICATES: false
      AWS_S3_CHECKSUM_CALCULATION_WHEN_REQUIRED: false
      AWS_S3_ENDPOINT: "${RENDERING2_S3_STORAGE_PROTOCOL:-http}://${RENDERING2_S3_STORAGE_HOST:-rendering2-rustfs-storage}:${RENDERING2_S3_STORAGE_PORT:-9000}"
      S3_HOST: "${RENDERING2_S3_STORAGE_HOST:-rendering2-rustfs-storage}"
      S3_PORT: "${RENDERING2_S3_STORAGE_PORT:-9000}"
      MONGODB_HOST: mongo-database
      MONGODB_PORT: 27017
      MONGODB_URL: "mongodb://${RENDERING2_LUMI_DATABASE_USER:-lumi}:${RENDERING2_LUMI_DATABASE_PASS:-lumi}@mongo-database:27017/${RENDERING2_LUMI_DATABASE_NAME:-lumi}"
      CONTENT_AWS_S3_BUCKET: "${RENDERING2_LUMI_CONTENT_BUCKET:-lumi-contentbucket}"
      CONTENT_MONGO_COLLECTION: h5p
      TEMPORARY_AWS_S3_BUCKET: "${RENDERING2_LUMI_TEMP_BUCKET:-lumi-tempbucket}"
      LIBRARY_MONGO_COLLECTION: h5plibraries
      LIBRARY_AWS_S3_BUCKET: "${RENDERING2_LUMI_LIB_BUCKET:-lumi-libbucket}"
      EDUSHARING_MONGO_COLLECTION: lumiedusharing
      BASE_URL: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}/public/h5p"
      CACHE: in-memory
      LOG_SCOPE: h5p:*
      LOG_LEVEL: info
      DEBUG: h5p:*
    expose:
      - "3000"

  rendering2-admin-frontend:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-admin-frontend:${docker.tag}"
    environment:
      PORT: 8080
      # Pfad, unter dem die UI ausgeliefert wird (eigener Pfad am selben Host wie der Service).
      BASE_HREF: "${RENDERING2_ADMIN_FRONTEND_PUBLIC_PATH:-/rendering-admin}/"
      # Admin-API liegt am Context-Path des Service -> same-origin, kein CORS.
      ADMIN_API_BASE: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      # Routing über nginx-proxy (VIRTUAL_*); externe Apache2-Deployments routen denselben
      # Pfad selbst auf diesen Container und ignorieren diese Variablen.
      VIRTUAL_HOST: "${RENDERING2_SERVICE_PUBLIC_HOST:-repository.127.0.0.1.nip.io}"
      VIRTUAL_PATH: "${RENDERING2_ADMIN_FRONTEND_PUBLIC_PATH:-/rendering-admin}/"
      VIRTUAL_PORT: 8080
    expose:
      - "8080"
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_ADMIN_FRONTEND_PORT_HTTP:-10400}:8080"

volumes:
  rendering2-rustfs-storage-volume-data:
