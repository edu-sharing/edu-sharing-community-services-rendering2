version: '3.7'

services:

  rendering2-rustfs-storage:
    image: "${docker.registry}/${docker.common}/${docker.edu_sharing.community.common.rustfs.name}:${docker.edu_sharing.community.common.rustfs.tag}"
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: "${RENDERING2_S3_STORAGE_USER:-rendering2}"
      RUSTFS_SECRET_KEY: "${RENDERING2_S3_STORAGE_PASSWORD:-rendering2}"
      # The rustfs image bakes RUSTFS_OBS_LOG_DIRECTORY=/logs by default (hourly-rotated files on disk).
      # Force it empty so the entrypoint's "-z" check falls back to stdout logging, since we ship logs via log aggregation.
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUST_BACKTRACE: full
    command: [ "rustfs" ]
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || wget -q -O /dev/null http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - "rendering2-rustfs-storage-volume-data:/data"
    expose:
      - 9000
      - 9001
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_RUSTFS_STORAGE_PORT_HTTP:-10201}:9001"

  rendering2-message-queue:
    image: "${docker.registry}/${docker.common}/${docker.edu_sharing.community.common.rabbitmq.name}:${docker.edu_sharing.community.common.rabbitmq.tag}"
    environment:
      RABBITMQ_DEFAULT_USER: "${RENDERING2_MESSAGE_QUEUE_USER:-rendering}"
      RABBITMQ_DEFAULT_PASS: "${RENDERING2_MESSAGE_QUEUE_PASSWORD:-rendering}"
      RABBITMQ_SECURE_PASSWORD: true
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: true
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    expose:
      - "5672"
      - "15672"
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_MESSAGE_QUEUE_PORT_HTTP:-10300}:15672"

  mongo-database:
    environment:
      MONGODB_EXTRA_RENDERING2_DATABASE: "${RENDERING2_SERVICE_DATABASE_NAME:-rendering}"
      MONGODB_EXTRA_RENDERING2_USERNAME: "${RENDERING2_SERVICE_DATABASE_USER:-rendering}"
      MONGODB_EXTRA_RENDERING2_PASSWORD: "${RENDERING2_SERVICE_DATABASES_PASS:-rendering}"
      MONGODB_EXTRA_LUMI_DATABASE: "${RENDERING2_LUMI_DATABASE_NAME:-lumi}"
      MONGODB_EXTRA_LUMI_USERNAME: "${RENDERING2_LUMI_DATABASE_USER:-lumi}"
      MONGODB_EXTRA_LUMI_PASSWORD: "${RENDERING2_LUMI_DATABASE_PASS:-lumi}"
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

  redis-cache:
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rendering2-service:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-service:${docker.tag}"
    # Graceful shutdown drains in-flight HTTP requests and RabbitMQ consumers (up to 35 min for an ffmpeg job,
    # see spring.lifecycle.timeout-per-shutdown-phase in application.properties). Docker's default of 10 s would
    # SIGKILL the container long before. Only an upper bound: an idle service still stops immediately.
    stop_grace_period: "${RENDERING2_SERVICE_STOP_GRACE_PERIOD:-40m}"
    command:
      - -Xms${RENDERING2_SERVICE_JAVA_XMS:-512m}
      - -Xmx${RENDERING2_SERVICE_JAVA_XMX:-512m}
      - -Dcom.sun.management.jmxremote
      - -Dcom.sun.management.jmxremote.authenticate=false
      - -Dcom.sun.management.jmxremote.port=7199
      - -Dcom.sun.management.jmxremote.ssl=false
    environment:
      S3_HOST: "${RENDERING2_S3_STORAGE_HOST:-rendering2-rustfs-storage}"
      S3_PORT: "${RENDERING2_S3_STORAGE_PORT:-9000}"
      app.s3.accessKeyId: "${RENDERING2_S3_STORAGE_USER:-rendering2}"
      app.s3.secretAccessKey: "${RENDERING2_S3_STORAGE_PASSWORD:-rendering2}"
      app.s3.region: eu-central-1
      app.s3.protocol: "${RENDERING2_S3_STORAGE_PROTOCOL:-http}"
      app.s3.bucket.mode: "${RENDERING2_S3_BUCKET_MODE:-byType}"
      app.s3.trustAllCertificates: false
      app.s3.checksumCalculationWhenRequired: false
      RABBITMQ_HOST: rendering2-message-queue
      RABBITMQ_PORT: 5672
      # One per-queue scaling knob: max messages processed in parallel per pod. Its meaning follows the
      # queue's mode (set in application.properties): STANDARD counts DirectMessageListenerContainer
      # consumers (burst fanned out at once, no auto-scale ramp; idle consumers cost nothing on the shared
      # virtual-thread executor) — size CPU-in-JVM (image, eduHtml) and ffmpeg (av) against cores.
      app.queue.job.concurrency: "${RENDERING2_QUEUE_JOB_CONCURRENCY:-20}"
      app.queue.image.concurrency: "${RENDERING2_QUEUE_IMAGE_CONCURRENCY:-4}"
      app.queue.av.concurrency: "${RENDERING2_QUEUE_AV_CONCURRENCY:-2}"
      app.queue.eduHtml.concurrency: "${RENDERING2_QUEUE_EDUHTML_CONCURRENCY:-5}"
      app.queue.document.concurrency: "${RENDERING2_QUEUE_DOCUMENT_CONCURRENCY:-8}"
      app.queue.jupyter.concurrency: "${RENDERING2_QUEUE_JUPYTER_CONCURRENCY:-8}"
      app.queue.binder.concurrency: "${RENDERING2_QUEUE_BINDER_CONCURRENCY:-1}"
      app.queue.binderPreview.concurrency: "${RENDERING2_QUEUE_BINDER_PREVIEW_CONCURRENCY:-1}"
      app.queue.onyx.concurrency: "${RENDERING2_QUEUE_ONYX_CONCURRENCY:-8}"
      app.queue.moodle.concurrency: "${RENDERING2_QUEUE_MOODLE_CONCURRENCY:-8}"
      # h5p stage 1: ask lumi whether the package is already imported (pure wait, fans out freely).
      app.queue.h5p-lookup.concurrency: "${RENDERING2_QUEUE_H5P_LOOKUP_CONCURRENCY:-20}"
      # REMOTE queues (sodix/omega/ddb) resolve a link/reference to externally-hosted material: concurrency = K
      # sizes the dedicated remote HTTP pool AND the broker prefetch; K messages run in parallel on virtual
      # threads. Scale throughput via more pods, not K.
      app.queue.sodix.concurrency: "${RENDERING2_QUEUE_SODIX_CONCURRENCY:-50}"
      app.queue.omega.concurrency: "${RENDERING2_QUEUE_OMEGA_CONCURRENCY:-50}"
      app.queue.ddb.concurrency: "${RENDERING2_QUEUE_DDB_CONCURRENCY:-50}"
      # Optional per-queue prefetch override for the remote queues — empty derives prefetch from concurrency
      # (1:1 with the remote HTTP pool); set only to run prefetch above concurrency while jobs spend time in
      # post-call Mongo/S3 work (must be >= concurrency, enforced at startup).
      app.queue.sodix.prefetch: "${RENDERING2_QUEUE_SODIX_PREFETCH:-}"
      app.queue.omega.prefetch: "${RENDERING2_QUEUE_OMEGA_PREFETCH:-}"
      app.queue.ddb.prefetch: "${RENDERING2_QUEUE_DDB_PREFETCH:-}"
      # h5p stage 2 (import) is SINGLE_ACTIVE (exactly one consumer cluster-wide, forced to 1) — not tunable here.
      # Global prefetch for STANDARD/SINGLE_ACTIVE queues (remote queues derive prefetch from concurrency).
      app.queue.prefetch: "${RENDERING2_QUEUE_PREFETCH:-1}"
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      MONGODB_HOST: mongo-database
      MONGODB_PORT: 27017
      VIRTUAL_HOST: "${RENDERING2_SERVICE_PUBLIC_HOST:-repository.127.0.0.1.nip.io}"
      VIRTUAL_PATH: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}/"
      VIRTUAL_PORT: 8080
      server.servlet.context-path: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      app.appId: rendering2
      app.security.enabled: true
      app.public.protocol: "${RENDERING2_SERVICE_PUBLIC_PROTOCOL:-http}"
      app.public.host: "${RENDERING2_SERVICE_PUBLIC_HOST:-repository.127.0.0.1.nip.io}"
      app.public.port: "${RENDERING2_SERVICE_PUBLIC_PORT:-80}"
      app.public.path: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      app.internal.protocol: http
      app.internal.host: rendering2-service
      app.internal.path: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      app.internal.port: 8080
      app.session.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_NODE_PERMISSION_EXPIRATION_TIME:-60}"
      app.session.image.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_IMAGE_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.audio.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_AUDIO_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.video.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_VIDEO_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.pdf.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_PDF_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.moodle.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_MOODLE_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.scorm.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_SCORM_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.eduHtml.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_EDUHTML_NODE_PERMISSION_EXPIRATION_TIME:-7200}"
      app.session.document.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_DOCUMENT_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.spreadsheet.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_SPREADSHEET_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.html.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_HTML_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.h5p.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_H5P_NODE_PERMISSION_EXPIRATION_TIME:-}"
      app.session.sodix.nodePermissionExpirationTime: "${RENDERING2_SERVICE_SESSION_SODIX_NODE_PERMISSION_EXPIRATION_TIME:-}"
      # Which document types are converted, by file extension. Unknown entries are skipped with a
      # warning; empty means all of them.
      app.converter.document.extensions: "${RENDERING2_SERVICE_CONVERTER_DOCUMENT_EXTENSIONS:-doc,docx,ppt,pptx,xls,xlsx,odt,odp,ods,txt,ott,rtf,csv}"
      app.converter.image.format: "${RENDERING2_SERVICE_CONVERTER_IMAGE_FORMAT:-jpeg}"
      app.converter.image.mimeTypes: "${RENDERING2_SERVICE_CONVERTER_IMAGE_MIME_TYPES:-image/vnd.wap.wbmp,image/png,image/x-png,image/jpeg,image/tiff,image/bmp,image/gif,image/x-webp,image/webp}"
      app.converter.image.sizes: "${RENDERING2_SERVICE_CONVERTER_IMAGE_SIZES:-800,1280,1920}"
      app.converter.image.maxPixels: "${RENDERING2_SERVICE_CONVERTER_IMAGE_MAX_PIXELS:-100000000}"
      # Render spreadsheets (xls/xlsx/ods/csv) as HTML via the document-converter. Switched off,
      # the SpreadsheetRenderModule is not registered at all and those files fall back to the
      # regular document rendering (PDF).
      app.converter.spreadsheetToHtml.enabled: "${RENDERING2_SERVICE_CONVERTER_SPREADSHEET_TO_HTML_ENABLED:-true}"
      app.converter.video.format: "${RENDERING2_SERVICE_CONVERTER_VIDEO_FORMAT:-mp4}"
      app.converter.video.ffmpegThreads: "${RENDERING2_SERVICE_CONVERTER_VIDEO_FFMPEG_THREADS:-4}"
      app.converter.video.ffmpegPreset: "${RENDERING2_SERVICE_CONVERTER_VIDEO_FFMPEG_PRESET:-veryfast}"
      app.converter.video.mimeTypes: "${RENDERING2_SERVICE_CONVERTER_VIDEO_MIME_TYPES:-video/mp4,video/mpeg,video/quicktime,video/x-msvideo,video/vnd.avi,video/avi,video/x-flv,video/x-matroska,video/ogg,video/x-ms-wmv,video/theora}"
      app.converter.video.resolutions: "${RENDERING2_SERVICE_CONVERTER_VIDEO_RESOLUTIONS:-480,720,1080}"
      app.converter.audio.mimeTypes: "${RENDERING2_SERVICE_CONVERTER_AUDIO_MIME_TYPES:-audio/mpeg,audio/mp4,audio/vnd.wav,audio/ogg,audio/vorbis,audio/wav,audio/x-wav,audio/x-ms-wma}"
      app.converter.audio.bitrate: "${RENDERING2_SERVICE_CONVERTER_AUDIO_BITRATE:-160}"
      app.converter.audio.ffmpegThreads: "${RENDERING2_SERVICE_CONVERTER_AUDIO_FFMPEG_THREADS:-1}"
      app.converter.av.ffmpegPath: "${RENDERING2_SERVICE_CONVERTER_AV_FFMPEG_PATH:-ffmpeg}"
      app.converter.av.niceness: "${RENDERING2_SERVICE_CONVERTER_AV_NICENESS:-0}"
      app.cache.cleaner.schedule: "${RENDERING2_SERVICE_CACHE_CLEANER_SCHEDULE:-0 */15 * * * *}"
      app.cache.cleaner.threshold.lower: "${RENDERING2_SERVICE_CACHE_CLEANER_THRESHOLD_LOWER:-0.7}"
      app.cache.cleaner.threshold.upper: "${RENDERING2_SERVICE_CACHE_CLEANER_THRESHOLD_UPPER:-0.9}"
      # Stale-job reaper (master only): times out orphaned PROCESSING sub-jobs (crashed/lost conversions)
      # so they cannot poison re-rendering until the 8-day TTL. schedule = fixed delay between runs in ms;
      # max-process-time per routing key (ISO-8601 Duration) must exceed the longest real duration.
      app.jobreaper.enabled: "${RENDERING2_JOBREAPER_ENABLED:-true}"
      app.jobreaper.schedule: "${RENDERING2_JOBREAPER_SCHEDULE:-600000}"
      app.jobreaper.default-max-process-time: "${RENDERING2_JOBREAPER_DEFAULT_MAX_PROCESS_TIME:-PT30M}"
      app.jobreaper.max-process-time.av_job: "${RENDERING2_JOBREAPER_MAX_PROCESS_TIME_AV_JOB:-PT45M}"
      # max-queued-time is deliberately much larger than max-process-time: QUEUED is also the state of a
      # legitimate backlog (e.g. HPA scale-up lag under a burst), not just a lost/never-delivered message.
      app.jobreaper.default-max-queued-time: "${RENDERING2_JOBREAPER_DEFAULT_MAX_QUEUED_TIME:-PT6H}"
      # One-time queue-durability migration (master only): deletes each pre-"_v2"-rename queue once no
      # consumer is attached anymore. See LegacyQueueCleaner. Disable once confirmed complete.
      app.queue-migration.enabled: "${RENDERING2_QUEUE_MIGRATION_ENABLED:-true}"
      app.queue-migration.schedule: "${RENDERING2_QUEUE_MIGRATION_SCHEDULE:-PT30M}"
      # Max time a main job may sit PROCESSING without sub-jobs (payload download); must exceed the longest source download.
      app.jobreaper.max-main-job-setup-time: "${RENDERING2_JOBREAPER_MAX_MAIN_JOB_SETUP_TIME:-PT1H}"
      # Entrypoint waits (entrypoint.sh, not Spring): max seconds per infrastructure service before the container
      # exits 1, and the best-effort wait for the registered repositories (0 = do not wait).
      INFRA_WAIT_TIMEOUT: "${RENDERING2_SERVICE_INFRA_WAIT_TIMEOUT:-300}"
      REPOSITORY_WAIT_TIMEOUT: "${RENDERING2_SERVICE_REPOSITORY_WAIT_TIMEOUT:-60}"
      # Repository registration retry loop (master only), see application.properties.
      app.repository.registration.repo-timeout-seconds: "${RENDERING2_SERVICE_REGISTRATION_REPO_TIMEOUT_SECONDS:-240}"
      app.repository.registration.retry-interval-millis: "${RENDERING2_SERVICE_REGISTRATION_RETRY_INTERVAL_MILLIS:-30000}"
      app.repository.registration.retry-initial-delay-seconds: "${RENDERING2_SERVICE_REGISTRATION_RETRY_INITIAL_DELAY_SECONDS:-30}"
      app.repository.registration.retry-max-delay-seconds: "${RENDERING2_SERVICE_REGISTRATION_RETRY_MAX_DELAY_SECONDS:-600}"
      app.module.binder.sse-idle-timeout: "${RENDERING2_SERVICE_BINDER_SSE_IDLE_TIMEOUT:-PT15M}"
      app.module.binder.max-file-size: "${RENDERING2_SERVICE_BINDER_MAX_FILE_SIZE:-50MB}"
      # Timeouts of the repository SDK's OkHttp clients; call = hard bound per request (0 = none).
      app.repository-http.timeout.connect: "${RENDERING2_SERVICE_REPOSITORY_HTTP_CONNECT_TIMEOUT:-10s}"
      app.repository-http.timeout.read: "${RENDERING2_SERVICE_REPOSITORY_HTTP_READ_TIMEOUT:-30s}"
      app.repository-http.timeout.write: "${RENDERING2_SERVICE_REPOSITORY_HTTP_WRITE_TIMEOUT:-30s}"
      app.repository-http.timeout.call: "${RENDERING2_SERVICE_REPOSITORY_HTTP_CALL_TIMEOUT:-60s}"
      # Resilience layer for calls to sodix/omega/omega-validation/ddb/github/lumi (retry only for idempotent GET/HEAD,
      # breaker per remote and pod, metrics rendering.remote.*). Per-remote overrides: app.resilience.modules.<name>.*.
      app.resilience.enabled: "${RENDERING2_SERVICE_RESILIENCE_ENABLED:-true}"
      app.resilience.retry.max-attempts: "${RENDERING2_SERVICE_RESILIENCE_RETRY_MAX_ATTEMPTS:-3}"
      app.resilience.retry.initial-backoff: "${RENDERING2_SERVICE_RESILIENCE_RETRY_INITIAL_BACKOFF:-200ms}"
      app.resilience.retry.max-backoff: "${RENDERING2_SERVICE_RESILIENCE_RETRY_MAX_BACKOFF:-2s}"
      app.resilience.retry.jitter: "${RENDERING2_SERVICE_RESILIENCE_RETRY_JITTER:-0.5}"
      app.resilience.retry.max-retry-after: "${RENDERING2_SERVICE_RESILIENCE_RETRY_MAX_RETRY_AFTER:-5s}"
      app.resilience.retry.total-budget: "${RENDERING2_SERVICE_RESILIENCE_RETRY_TOTAL_BUDGET:-75s}"
      app.resilience.circuit-breaker.enabled: "${RENDERING2_SERVICE_RESILIENCE_CIRCUIT_BREAKER_ENABLED:-true}"
      app.resilience.circuit-breaker.failure-threshold: "${RENDERING2_SERVICE_RESILIENCE_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}"
      app.resilience.circuit-breaker.open-duration: "${RENDERING2_SERVICE_RESILIENCE_CIRCUIT_BREAKER_OPEN_DURATION:-30s}"
      app.resilience.circuit-breaker.half-open-max-calls: "${RENDERING2_SERVICE_RESILIENCE_CIRCUIT_BREAKER_HALF_OPEN_MAX_CALLS:-1}"
      app.resilience.circuit-breaker.failure-classification: "${RENDERING2_SERVICE_RESILIENCE_CIRCUIT_BREAKER_FAILURE_CLASSIFICATION:-DEFAULT}"
      app.resilience.bulkhead.enabled: "${RENDERING2_SERVICE_RESILIENCE_BULKHEAD_ENABLED:-true}"
      app.resilience.bulkhead.max-concurrent-calls: "${RENDERING2_SERVICE_RESILIENCE_BULKHEAD_MAX_CONCURRENT_CALLS:-64}"
      app.resilience.bulkhead.max-wait: "${RENDERING2_SERVICE_RESILIENCE_BULKHEAD_MAX_WAIT:-0s}"
      # DDB consumer key transport: QUERY (default) or HEADER (unverified against the live API, opt-in only).
      app.module.ddb.auth-mode: "${RENDERING2_SERVICE_DDB_AUTH_MODE:-QUERY}"
      # Retry/timeout budget of the document/jupyter converter calls (transient 502/503/504, connection errors, timeouts).
      app.converter.call.max-attempts: "${RENDERING2_SERVICE_CONVERTER_CALL_MAX_ATTEMPTS:-3}"
      app.converter.call.initial-backoff: "${RENDERING2_SERVICE_CONVERTER_CALL_INITIAL_BACKOFF:-2s}"
      app.converter.call.max-backoff: "${RENDERING2_SERVICE_CONVERTER_CALL_MAX_BACKOFF:-20s}"
      app.converter.call.attempt-timeout: "${RENDERING2_SERVICE_CONVERTER_CALL_ATTEMPT_TIMEOUT:-330s}"
      app.converter.call.total-budget: "${RENDERING2_SERVICE_CONVERTER_CALL_TOTAL_BUDGET:-15m}"
      app.converter.call.max-retry-after: "${RENDERING2_SERVICE_CONVERTER_CALL_MAX_RETRY_AFTER:-30s}"
      app.scheduling.pool-size: "${RENDERING2_SERVICE_SCHEDULING_POOL_SIZE:-4}"
      # Startup sweep of orphaned job temp files (stale-file-age must exceed the longest job).
      app.temp.cleanup.enabled: "${RENDERING2_SERVICE_TEMP_CLEANUP_ENABLED:-true}"
      app.temp.cleanup.stale-file-age: "${RENDERING2_SERVICE_TEMP_CLEANUP_STALE_FILE_AGE:-PT6H}"
      # MongoDB driver timeouts (socket-timeout stays above the slowest cache-cleaner aggregation).
      app.mongodb.timeout.connect-timeout: "${RENDERING2_SERVICE_MONGODB_CONNECT_TIMEOUT:-10s}"
      app.mongodb.timeout.socket-timeout: "${RENDERING2_SERVICE_MONGODB_SOCKET_TIMEOUT:-5m}"
      app.mongodb.timeout.server-selection-timeout: "${RENDERING2_SERVICE_MONGODB_SERVER_SELECTION_TIMEOUT:-30s}"
      # RabbitMQ timeouts. cache.channel.size is a HARD limit: raise it together with any app.queue.<x>.concurrency
      # (it must cover all consumer channels of the container plus concurrent publishers).
      spring.rabbitmq.connection-timeout: "${RENDERING2_SERVICE_RABBITMQ_CONNECTION_TIMEOUT:-10s}"
      spring.rabbitmq.channel-rpc-timeout: "${RENDERING2_SERVICE_RABBITMQ_CHANNEL_RPC_TIMEOUT:-30s}"
      spring.rabbitmq.requested-heartbeat: "${RENDERING2_SERVICE_RABBITMQ_HEARTBEAT:-30s}"
      spring.rabbitmq.cache.channel.size: "${RENDERING2_SERVICE_RABBITMQ_CACHE_CHANNEL_SIZE:-400}"
      spring.rabbitmq.cache.channel.checkout-timeout: "${RENDERING2_SERVICE_RABBITMQ_CHECKOUT_TIMEOUT:-30s}"
      # Lettuce (Redis) resilience and Spring Session bootstrap; NO_OP for managed Redis that forbids CONFIG.
      app.redis.client.command-timeout: "${RENDERING2_SERVICE_REDIS_COMMAND_TIMEOUT:-5s}"
      app.redis.client.connect-timeout: "${RENDERING2_SERVICE_REDIS_CONNECT_TIMEOUT:-10s}"
      app.redis.client.keep-alive: "${RENDERING2_SERVICE_REDIS_KEEP_ALIVE:-true}"
      app.redis.client.request-queue-size: "${RENDERING2_SERVICE_REDIS_REQUEST_QUEUE_SIZE:-2000}"
      app.redis.client.disconnected-behavior: "${RENDERING2_SERVICE_REDIS_DISCONNECTED_BEHAVIOR:-DEFAULT}"
      app.redis.session.configure-action: "${RENDERING2_SERVICE_REDIS_SESSION_CONFIGURE_ACTION:-DEFAULT}"
      # S3 client pool/timeouts and the health probe (HEAD on a bucket that need not exist).
      app.s3.client.max-connections: "${RENDERING2_SERVICE_S3_MAX_CONNECTIONS:-200}"
      app.s3.client.connection-timeout: "${RENDERING2_SERVICE_S3_CONNECTION_TIMEOUT:-10s}"
      app.s3.client.socket-timeout: "${RENDERING2_SERVICE_S3_SOCKET_TIMEOUT:-2m}"
      app.s3.client.connection-acquisition-timeout: "${RENDERING2_SERVICE_S3_CONNECTION_ACQUISITION_TIMEOUT:-30s}"
      app.s3.client.connection-max-idle-time: "${RENDERING2_SERVICE_S3_CONNECTION_MAX_IDLE_TIME:-1m}"
      app.s3.client.api-call-attempt-timeout: "${RENDERING2_SERVICE_S3_API_CALL_ATTEMPT_TIMEOUT:-30m}"
      app.s3.client.api-call-timeout: "${RENDERING2_SERVICE_S3_API_CALL_TIMEOUT:-1h}"
      app.s3.health.bucket: "${RENDERING2_SERVICE_S3_HEALTH_BUCKET:-rendering-health-probe}"
      app.s3.health.timeout: "${RENDERING2_SERVICE_S3_HEALTH_TIMEOUT:-5s}"
      spring.rabbitmq.username: "${RENDERING2_MESSAGE_QUEUE_USER:-rendering}"
      spring.rabbitmq.password: "${RENDERING2_MESSAGE_QUEUE_PASSWORD:-rendering}"
      app.repository.registration.id.local.url: http://repository-service:8080/edu-sharing
      app.repository.registration.id.local.username: admin
      app.repository.registration.id.local.password: "${REPOSITORY_SERVICE_ADMIN_PASS:-admin}"
      app.repository.registration.id.local.optional-modules: "${RENDERING2_OPTIONAL_MODULES:-H5P,EDUHTML,SPREADSHEET,HTML}"
      app.repository.registration.id.local.module.MOODLE.credentials.baseurl: "${RENDERING2_MOODLE_URL:-}"
      # Optional, mainly for local testing and development: the URL a browser uses to reach
      # Moodle, for setups where that differs from baseurl (e.g. baseurl points into the docker
      # network). Left blank it counts as unset - forward links and the Host header are then
      # derived from baseurl alone.
      app.repository.registration.id.local.module.MOODLE.credentials.publicurl: "${RENDERING2_MOODLE_PUBLIC_URL:-}"
      app.repository.registration.id.local.module.MOODLE.credentials.user: "${RENDERING2_MOODLE_USER:-}"
      app.repository.registration.id.local.module.MOODLE.credentials.token:  "${RENDERING2_MOODLE_TOKEN:-}"
      app.repository.registration.id.local.module.MOODLE.credentials.timeout: "${RENDERING2_MOODLE_TIMEOUT:-90}"
      app.repository.registration.id.local.module.MOODLE.credentials.categoryid: "${RENDERING2_MOODLE_CATEGORY_ID:-1}"
      app.repository.registration.id.local.module.MOODLE.credentials.submitUserDetails: "${RENDERING2_MOODLE_SUBMIT_USER_DETAILS:-true}"
      app.repository.registration.id.local.module.MOODLE.credentials.password: "${RENDERING2_MOODLE_PASSWORD:-}"
      # Display switch handed to the rendering frontend via the job-info additionalData map - not
      # sent to Moodle: whether the course is embedded in an iframe, or shown as a preview image.
      # The "go to course" link is always shown. Defaults to true; only a literal "false" turns it
      # off. Blank counts as unset (the registration drops blank credential values), hence no
      # default here.
      app.repository.registration.id.local.module.MOODLE.credentials.showPreviewIframe: "${RENDERING2_MOODLE_SHOW_PREVIEW_IFRAME:-}"
      app.repository.registration.id.local.module.SCORM.credentials.baseurl: "${RENDERING2_SCORM_URL:-}"
      # Optional, mainly for local testing and development: the URL a browser uses to reach
      # Moodle, for setups where that differs from baseurl (e.g. baseurl points into the docker
      # network). Left blank it counts as unset - forward links and the Host header are then
      # derived from baseurl alone.
      app.repository.registration.id.local.module.SCORM.credentials.publicurl: "${RENDERING2_SCORM_PUBLIC_URL:-}"
      app.repository.registration.id.local.module.SCORM.credentials.user: "${RENDERING2_SCORM_USER:-}"
      app.repository.registration.id.local.module.SCORM.credentials.token:  "${RENDERING2_SCORM_TOKEN:-}"
      app.repository.registration.id.local.module.SCORM.credentials.timeout: "${RENDERING2_SCORM_TIMEOUT:-90}"
      app.repository.registration.id.local.module.SCORM.credentials.categoryid: "${RENDERING2_SCORM_CATEGORY_ID:-1}"
      app.repository.registration.id.local.module.SCORM.credentials.submitUserDetails: "${RENDERING2_SCORM_SUBMIT_USER_DETAILS:-true}"
      app.repository.registration.id.local.module.SCORM.credentials.password: "${RENDERING2_SCORM_PASSWORD:-}"
      # Display switch handed to the rendering frontend via the job-info additionalData map - not
      # sent to Moodle: whether the SCORM package is embedded in an iframe, or shown as a preview
      # image. The "go to course" link is always shown. Defaults to true; only a literal "false"
      # turns it off. Blank counts as unset (the registration drops blank credential values), hence
      # no default here.
      app.repository.registration.id.local.module.SCORM.credentials.showPreviewIframe: "${RENDERING2_SCORM_SHOW_PREVIEW_IFRAME:-}"
      app.repository.registration.id.local.module.H5P.cspHeader: "${RENDERING2_H5P_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.module.SPREADSHEET.cspHeader: "${RENDERING2_SPREADSHEET_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.module.HTML.cspHeader: "${RENDERING2_HTML_CSP_HEADER:-frame-ancestors *}"
      app.repository.registration.id.local.module.EDUHTML.cspHeader: "${RENDERING2_HTML_CSP_HEADER:-frame-ancestors *}"

      app.repository.registration.id.local.module.SODIX.credentials.baseurl: "${RENDERING2_SODIX_BASEURL:-}"
      app.repository.registration.id.local.module.SODIX.credentials.playoutMimetypes: "${RENDERING2_SODIX_PLAYOUTMIMETYPES:-}"
      app.repository.registration.id.local.module.SODIX.credentials.allowExternalFrameSrc: "${RENDERING2_SODIX_ALLOWEXTERNALFRAMESOURCES:-}"

      app.repository.registration.id.local.externalBuckets.renderingBucket.name: "${RENDERING2_S3_RENDERING_BUCKET:-}"
      # Storage quota for the rendering bucket (0/empty = no limit; externalBucket mode only). Only
      # enforced by the cache cleaner, and only takes effect while app.s3.bucket.mode=externalBucket.
      # Accepts a plain byte count or a human-readable size (e.g. 10GB — Spring's binary units, 1KB = 1024 bytes).
      app.repository.registration.id.local.externalBuckets.renderingBucket.quota: "${RENDERING2_S3_RENDERING_BUCKET_QUOTA:-0}"
      app.repository.registration.id.local.externalBuckets.tempBucket.name: "${RENDERING2_S3_TEMP_BUCKET:-}"
      # Storage quota for the temp bucket (0/empty = no limit; same format as above). Informational
      # only — the cache cleaner never enforces it; see GET /admin/storage/usage?exact=true to measure it on demand.
      app.repository.registration.id.local.externalBuckets.tempBucket.quota: "${RENDERING2_S3_TEMP_BUCKET_QUOTA:-0}"
      # Storage quota for this repository (0/empty = no limit; same format as above). Only enforced by
      # the cache cleaner, and only as long as none of this repo's buckets (above, or the lumi content
      # bucket) has its own quota configured — a single bucket quota switches this repo entirely to
      # per-bucket enforcement.
      app.repository.registration.id.local.quota: "${RENDERING2_S3_DEFAULT_QUOTA:-100GB}"
      app.security.adminPassword: "${RENDERING2_SERVICE_ADMIN_PASSWORD:-admin}"
      spring.http.codecs.max-in-memory-size: "${RENDERING2_SERVICE_MAX_IN_MEMORY_SIZE:-20MB}"
      # The dedicated import HTTP pools (sodix/omega/ddb) are sized per queue via
      # app.queue.<x>.concurrency above (Reactor Netty maxConnections, per remote host).
      spring.mongodb.authentication-database: "${RENDERING2_SERVICE_DATABASE_NAME:-rendering}"
      spring.mongodb.database: "${RENDERING2_SERVICE_DATABASE_NAME:-rendering}"
      spring.mongodb.username: "${RENDERING2_SERVICE_DATABASE_USER:-rendering}"
      spring.mongodb.password: "${RENDERING2_SERVICE_DATABASES_PASS:-rendering}"
      server.servlet.session.cookie.same-site: "${RENDERING2_SERVICE_COOKIE_SAME_SITE:-Lax}"
      server.servlet.session.cookie.secure: "${RENDERING2_SERVICE_COOKIE_SECURE:-false}"
      server.servlet.session.cookie.partitioned: "${RENDERING2_SERVICE_COOKIE_PARTITIONED:-false}"
      app.lumi.host: http://rendering2-lumi:3000
      # Upper bound for lumi to deliver status + headers of a proxied H5P response (each proxied request holds a
      # Tomcat thread this long at most; a timeout is answered with 504).
      app.lumi.proxy.response-headers-timeout: "${RENDERING2_SERVICE_LUMI_PROXY_RESPONSE_HEADERS_TIMEOUT:-20s}"
      app.documentConverter.host: http://rendering2-document-converter:8080
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    # Readiness on the management port (management.server.port, same endpoint the Helm chart probes). curl ships in the image.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9080/actuator/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 3m
    expose:
      - "8080"
    depends_on:
      mongo-database:
        condition: service_healthy
      rendering2-message-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      rendering2-rustfs-storage:
        condition: service_healthy
      # Lumi can need minutes to start; H5P jobs consumed earlier fail with "connection refused".
      rendering2-lumi:
        condition: service_healthy
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_SERVICE_PORT_HTTP:-10100}:8080"

  rendering2-document-converter:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-document-converter:${docker.tag}"
    command:
      - -Xms${RENDERING2_SERVICE_DOCUMENT_CONVERTER_JAVA_XMS:-1g}
      - -Xmx${RENDERING2_SERVICE_DOCUMENT_CONVERTER_JAVA_XMX:-1g}
      - -Dcom.sun.management.jmxremote
      - -Dcom.sun.management.jmxremote.authenticate=false
      - -Dcom.sun.management.jmxremote.port=7199
      - -Dcom.sun.management.jmxremote.ssl=false
    environment:
      # Comma-separated ports = parallel LibreOffice processes (= parallel conversions per container).
      # Keep CPU/memory below in line (~1 vCPU + ~1 GiB per process); the heap stays small because
      # LibreOffice runs as a subprocess outside the JVM heap.
      LIBREOFFICE_PORT_NUMBERS: "${RENDERING2_DOCUMENT_CONVERTER_LIBREOFFICE_PORTS:-2002,2003}"
      LIBREOFFICE_MAX_TASKS_PER_PROCESS: "${RENDERING2_DOCUMENT_CONVERTER_LIBREOFFICE_MAX_TASKS_PER_PROCESS:-100}"
      LIBREOFFICE_TASK_EXECUTION_TIMEOUT: "${RENDERING2_DOCUMENT_CONVERTER_LIBREOFFICE_TASK_EXECUTION_TIMEOUT:-120000}"
      LIBREOFFICE_TASK_QUEUE_TIMEOUT: "${RENDERING2_DOCUMENT_CONVERTER_LIBREOFFICE_TASK_QUEUE_TIMEOUT:-300000}"
      # Time to start/connect/terminate one office process (ms) and the pause between attempts (ms).
      LIBREOFFICE_PROCESS_TIMEOUT: "${RENDERING2_DOCUMENT_CONVERTER_LIBREOFFICE_PROCESS_TIMEOUT:-120000}"
      LIBREOFFICE_PROCESS_RETRY_INTERVAL: "${RENDERING2_DOCUMENT_CONVERTER_LIBREOFFICE_PROCESS_RETRY_INTERVAL:-250}"
      # LibreOffice readiness probe (txt->pdf, cached); readiness only, liveness stays independent.
      LIBREOFFICE_HEALTH_PROBE_ENABLED: "${RENDERING2_DOCUMENT_CONVERTER_HEALTH_PROBE_ENABLED:-true}"
      LIBREOFFICE_HEALTH_PROBE_TIMEOUT: "${RENDERING2_DOCUMENT_CONVERTER_HEALTH_PROBE_TIMEOUT:-10s}"
      LIBREOFFICE_HEALTH_CACHE_TTL: "${RENDERING2_DOCUMENT_CONVERTER_HEALTH_CACHE_TTL:-30s}"
      LIBREOFFICE_HEALTH_FAILURE_THRESHOLD: "${RENDERING2_DOCUMENT_CONVERTER_HEALTH_FAILURE_THRESHOLD:-3}"
      # Temp files of the conversion pipeline (empty = <java.io.tmpdir>/doc-converter), the startup sweep age of stale
      # temp files, the scan window for HTML styles and the max HTML size parsed into a DOM.
      CONVERTER_WORK_DIR: "${RENDERING2_DOCUMENT_CONVERTER_WORK_DIR:-}"
      CONVERTER_STALE_FILE_AGE: "${RENDERING2_DOCUMENT_CONVERTER_STALE_FILE_AGE:-6h}"
      CONVERTER_HTML_STYLE_SCAN_WINDOW: "${RENDERING2_DOCUMENT_CONVERTER_HTML_STYLE_SCAN_WINDOW:-256KB}"
      CONVERTER_MAX_HTML_DOM_SIZE: "${RENDERING2_DOCUMENT_CONVERTER_MAX_HTML_DOM_SIZE:-32MB}"
    cpus: "${RENDERING2_DOCUMENT_CONVERTER_CPUS:-2}"
    mem_limit: "${RENDERING2_DOCUMENT_CONVERTER_MEMORY:-4g}"
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    # Management port of the document-converter (management.server.port); busybox wget ships in the image.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 2m
    expose:
      - "8080"

  rendering2-lumi:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-lumi:${docker.tag}"
    environment:
      AWS_ACCESS_KEY_ID: "${RENDERING2_S3_STORAGE_USER:-rendering2}"
      AWS_SECRET_ACCESS_KEY: "${RENDERING2_S3_STORAGE_PASSWORD:-rendering2}"
      AWS_S3_MAX_FILE_LENGTH: "${RENDERING2_LUMI_MAX_FILE_SIZE:-1000}"
      AWS_S3_REGION: eu-central-1
      AWS_S3_TRUST_ALL_CERTIFICATES: false
      AWS_S3_CHECKSUM_CALCULATION_WHEN_REQUIRED: false
      AWS_S3_MAX_SOCKETS: "${RENDERING2_LUMI_S3_MAX_SOCKETS:-256}"
      # A pool that is full, has requests waiting and in which not a single request settles for this
      # long is stuck on sockets that will never come back; lumi then destroys them. 0 = off.
      AWS_S3_POOL_STALL_MS: "${RENDERING2_LUMI_S3_POOL_STALL_MS:-120000}"
      AWS_S3_ENDPOINT: "${RENDERING2_S3_STORAGE_PROTOCOL:-http}://${RENDERING2_S3_STORAGE_HOST:-rendering2-rustfs-storage}:${RENDERING2_S3_STORAGE_PORT:-9000}"
      S3_HOST: "${RENDERING2_S3_STORAGE_HOST:-rendering2-rustfs-storage}"
      S3_PORT: "${RENDERING2_S3_STORAGE_PORT:-9000}"
      MONGODB_HOST: mongo-database
      MONGODB_PORT: 27017
      MONGODB_URL: "mongodb://${RENDERING2_LUMI_DATABASE_USER:-lumi}:${RENDERING2_LUMI_DATABASE_PASS:-lumi}@mongo-database:27017/${RENDERING2_LUMI_DATABASE_NAME:-lumi}"
      CONTENT_AWS_S3_BUCKET: "${RENDERING2_LUMI_CONTENT_BUCKET:-lumi-contentbucket}"
      # Storage quota for the content bucket (0/empty = no limit; a plain byte count or a
      # human-readable size like 10GB — binary units, 1KB = 1024 bytes, see lumi's parseDataSize).
      # Only enforced by rendering2's CacheCleaner; queried live from lumi (GET /edusharing/buckets),
      # not duplicated in rendering2's own repository registration.
      CONTENT_AWS_S3_BUCKET_QUOTA: "${RENDERING2_LUMI_CONTENT_BUCKET_QUOTA:-0}"
      CONTENT_MONGO_COLLECTION: h5p
      TEMPORARY_AWS_S3_BUCKET: "${RENDERING2_LUMI_TEMP_BUCKET:-lumi-tempbucket}"
      # Days after which objects in the temp bucket expire (S3 lifecycle rule, re-applied on every lumi start).
      TEMPORARY_AWS_S3_BUCKET_EXPIRATION_DAYS: "${RENDERING2_LUMI_TEMP_BUCKET_EXPIRATION_DAYS:-1}"
      LIBRARY_MONGO_COLLECTION: h5plibraries
      LIBRARY_AWS_S3_BUCKET: "${RENDERING2_LUMI_LIB_BUCKET:-lumi-libbucket}"
      EDUSHARING_MONGO_COLLECTION: lumiedusharing
      BASE_URL: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}/public/h5p"
      CACHE: in-memory
      # How libraries of imported H5P packages are stored. "global" (default) keeps the single shared
      # store in Mongo/S3. "package" gives every imported package its own isolated cache holding the
      # exact library versions it shipped; that cache is authoritative, hence the volume below.
      H5P_LIBRARY_CACHE: "${RENDERING2_LUMI_LIBRARY_CACHE:-global}"
      H5P_LIBRARY_CACHE_DIR: /application/library-cache
      # Soft size limit for that cache; a plain byte count or a human-readable size like "10GB" (binary
      # units). 0/empty = no limit. lumi never rejects an import for it - it reports it, and rendering2's
      # CacheCleaner frees the cache (least recently used content first) once it is exceeded, as for the
      # buckets. What really limits the cache is the volume it lives on, so keep the quota below that.
      H5P_LIBRARY_CACHE_QUOTA: "${RENDERING2_LUMI_LIBRARY_CACHE_QUOTA:-0}"
      # Hours a measurement of the cache stays valid. A start with a younger one does not walk the cache
      # again (that takes minutes for millions of files), and it is measured again this often while
      # running. 0 = measure at every start only.
      H5P_LIBRARY_CACHE_RESCAN_HOURS: "${RENDERING2_LUMI_LIBRARY_CACHE_RESCAN_HOURS:-24}"
      # Deadline of one package import. Imports run one at a time, so an import that never returns used
      # to block every later one; past the deadline it is answered with 504 and the queue moves on.
      # Keep it above the rendering service's H5P timeout (repository credential "timeout"). 0 = off.
      H5P_IMPORT_TIMEOUT_MS: "${RENDERING2_LUMI_IMPORT_TIMEOUT_MS:-900000}"
      # Largest H5P package lumi accepts: H5P_MAX_TOTAL_SIZE is its size once unpacked, H5P_MAX_FILE_SIZE
      # that of a single file in it (plain byte count or e.g. "2GB", binary units). The import streams
      # from disk, so neither is bound by memory - but /tmp needs room for the spooled upload plus the
      # unpacked package. Requests this big also need the rendering service's H5P timeout (repository
      # credential "timeout", default 300 s) and H5P_IMPORT_TIMEOUT_MS above to be raised accordingly.
      H5P_MAX_TOTAL_SIZE: "${RENDERING2_LUMI_MAX_PACKAGE_SIZE:-4GB}"
      H5P_MAX_FILE_SIZE: "${RENDERING2_LUMI_MAX_PACKAGE_FILE_SIZE:-2GB}"
      # Extra file extensions the package validator accepts, on top of its short defaults (content: no svg, webp,
      # mov, flac). Space or comma separated, e.g. "svg webp". Empty = defaults only.
      H5P_CONTENT_WHITELIST_EXTRA: "${RENDERING2_LUMI_CONTENT_WHITELIST_EXTRA:-}"
      H5P_LIBRARY_WHITELIST_EXTRA: "${RENDERING2_LUMI_LIBRARY_WHITELIST_EXTRA:-}"
      LOG_SCOPE: h5p:*
      LOG_LEVEL: info
      DEBUG: h5p:*
      # How long a shutdown waits for a running import before the process exits; keep it below stop_grace_period.
      SHUTDOWN_TIMEOUT_MS: "${RENDERING2_LUMI_SHUTDOWN_TIMEOUT_MS:-30000}"
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    stop_grace_period: "${RENDERING2_LUMI_STOP_GRACE_PERIOD:-40s}"
    depends_on:
      mongo-database:
        condition: service_healthy
      rendering2-rustfs-storage:
        condition: service_healthy
    volumes:
      - "rendering2-lumi-volume-library-cache:/application/library-cache"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m
    expose:
      - "3000"

  rendering2-admin-frontend:
    image: "${docker.registry}/${docker.repository}/${docker.prefix}-deploy-docker-build-admin-frontend:${docker.tag}"
    environment:
      PORT: 8080
      # Pfad, unter dem die UI ausgeliefert wird (eigener Pfad am selben Host wie der Service).
      BASE_HREF: "${RENDERING2_ADMIN_FRONTEND_PUBLIC_PATH:-/rendering-admin}/"
      # Admin-API liegt am Context-Path des Service -> same-origin, kein CORS.
      ADMIN_API_BASE: "${RENDERING2_SERVICE_PUBLIC_PATH:-/rendering}"
      # Routing über nginx-proxy (VIRTUAL_*); externe Apache2-Deployments routen denselben
      # Pfad selbst auf diesen Container und ignorieren diese Variablen.
      VIRTUAL_HOST: "${RENDERING2_SERVICE_PUBLIC_HOST:-repository.127.0.0.1.nip.io}"
      VIRTUAL_PATH: "${RENDERING2_ADMIN_FRONTEND_PUBLIC_PATH:-/rendering-admin}/"
      VIRTUAL_PORT: 8080
    restart: "${RENDERING2_RESTART_POLICY:-on-failure:5}"
    # server.mjs answers /ping at the root regardless of BASE_HREF (also under the prefix); node ships in the image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "8080"
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${RENDERING2_ADMIN_FRONTEND_PORT_HTTP:-10400}:8080"

volumes:
  rendering2-lumi-volume-library-cache:
  rendering2-rustfs-storage-volume-data:
