# One-time durability migration safety net (see LegacyQueueCleaner) - legacy names as they existed in
# this test profile before the _v2 rename (h5p differs from prod's h5p_import_job_queue, see above).
app.queue-migration.enabled=true
app.queue-migration.schedule=PT30M
app.queue-migration.legacy-queue-names=rendering_job_queue,image_job_queue,av_job_queue,moodle_job_queue,edu_html_job_queue,h5p_lookup_job_queue,h5p_job_queue,document_job_queue,jupyter_job_queue,onyx_job_queue,binder_job_queue,binder_preview_job_queue,sodix_job_queue,omega_job_queue,ddb_job_queue

app.converter.image.format=jpeg
app.converter.image.mimeTypes=image/vnd.wap.wbmp,image/x-png,image/jpeg,image/tiff,image/bmp,image/x-webp,image/webp
app.converter.image.sizes=800,1280,1920
## Reject source images larger than this many pixels (width*height) before decoding
app.converter.image.maxPixels=100000000

app.converter.spreadsheetToHtml.enabled=true

app.converter.video.format=mp4
app.converter.video.mimeTypes=video/mp4,video/mpeg,video/quicktime,video/x-msvideo,video/vnd.avi,video/avi,video/x-flv,video/x-matroska,video/ogg,video/x-ms-wmv,video/theora
## 0 = ffmpeg decides how many threads to use, else specify the number of threads
app.converter.video.ffmpegThreads=0
app.converter.video.ffmpegPreset=veryfast
app.converter.video.resolutions.480.priority=2
app.converter.video.resolutions.720.priority=1
app.converter.video.resolutions.1080.priority=0


app.converter.audio.mimeTypes=audio/mpeg,audio/mp4,audio/vnd.wav,audio/ogg,audio/vorbis,audio/wav,audio/x-wav,audio/x-ms-wma
app.converter.audio.bitrate=160000
app.converter.audio.ffmpegThreads=0
app.converter.av.conversionTimeout=PT30M
app.converter.av.ffmpegPath=ffmpeg

