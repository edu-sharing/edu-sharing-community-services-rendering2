logging.level.org.edu_sharing.rendering.core.dto.ErrorMessage=WARN

# Distributed tracing (Micrometer Tracing + OpenTelemetry, b3 propagation to match Istio).
# A trace id is taken from the incoming b3 header when present, otherwise generated (128-bit hex);
# it is propagated onto outbound calls (WebClient/OkHttp/RabbitMQ) and added to every log line.
# The app does NOT export spans itself — in the Istio mesh the Envoy sidecar generates and reports
# the spans to the backend; the app only has to forward the b3 headers (see service/pom.xml).
spring.application.name=rendering2
spring.reactor.context-propagation=auto
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,metrics,prometheus,logger

management.server.address=0.0.0.0
management.server.port=9080

server.servlet.session.cookie.name=SESSION_RS2
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.partitioned=false


springdoc.api-docs.version=openapi_3_1
# Without this, controllers that don't declare `produces` emit `*/*` as the response media type,
# which the generated admin-frontend client maps to responseType 'blob' (JSON never parsed).
springdoc.default-produces-media-type=application/json
springdoc.api-docs.groups.enabled=true
springdoc.group-configs[0].group=api
springdoc.group-configs[0].display-name=API
springdoc.group-configs[0].paths-to-match=/public/**

springdoc.group-configs[1].group=administration
springdoc.group-configs[1].display-name=Administration
springdoc.group-configs[1].paths-to-match=/admin/**
