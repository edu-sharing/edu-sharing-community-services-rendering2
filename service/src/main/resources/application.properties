app.security.adminPassword=admin
app.security.enabled=true
# Comma-separated whitelist of accepted node-signature algorithms (java.security.Signature names).
app.security.allowed-signature-algorithms=SHA256withRSA,SHA512withRSA

# Outbound WebClient timeouts. The default applies to quick API calls; the long-running value
# applies to file conversions and content uploads (lumi/onyx/moodle), which can run much longer.
app.webclient.connect-timeout-millis=10000
app.webclient.response-timeout-seconds=60
app.webclient.long-running-response-timeout-seconds=600
# Concurrency limits of the shared OkHttp dispatcher used by all edu-sharing repository SDK clients (async
# calls such as trackEventAsync). OkHttp's defaults (64 / 5 per host) would throttle them to 5 parallel calls
# because they all hit one repository host. Raise if calls queue up.
app.repository-http.max-requests=256
app.repository-http.max-requests-per-host=128
# Timeouts of the OkHttp clients behind the repository SDK (RepositoryHttpTimeoutProperties). call is the hard upper
# bound for one request including redirects and retries; 0 = no limit.
app.repository-http.timeout.connect=10s
app.repository-http.timeout.read=30s
app.repository-http.timeout.write=30s
app.repository-http.timeout.call=60s
# The dedicated remote HTTP pools (sodix/omega/ddb) are sized per queue from app.queue.<x>.concurrency
# (mode=REMOTE) — see the queue section below and the *RemoteConfig classes.

# Every 15 minutes: the quota is a soft limit, so a frequent cheap check (tracking aggregation, no S3
# listing) keeps a bucket from overshooting it between runs. Same defaults as compose + helm.
app.cache.cleaner.schedule=0 */15 * * * *
app.cache.cleaner.threshold.lower=0.7
app.cache.cleaner.threshold.upper=0.9

app.cors.sync.schedule=300000

# Stale-job reaper (master only): periodically times out orphaned PROCESSING sub-jobs whose conversion
# never completed (e.g. a converter pod crashed mid-job). Timed-out sub-jobs get SubJobStatus.TIMEOUT and
# their main job is reconciled to FAILED/PARTIALLY_FAILED — no re-queue (the frontend re-requests). This
# unblocks re-rendering (MainJobCreationService otherwise reuses the non-terminal job for 8 days). `schedule`
# is the fixed delay between runs in ms.
app.jobreaper.enabled=true
app.jobreaper.schedule=600000
# Max processing time per routing key (ISO-8601 Duration). Must exceed the longest *real* duration for that
# type or legitimately slow jobs get reaped. `default` applies to any type without an explicit entry; keys
# are the queue routing keys (app.queue.<module>.key), e.g. av_job runs longer (ffmpeg guard is PT30M).
app.jobreaper.default-max-process-time=PT30M
app.jobreaper.max-process-time.av_job=PT45M
# Max time a (sub-)job may sit QUEUED before being reaped as orphaned (lost publish, or a queue that no
# longer exists — see LegacyQueueCleaner below — never redelivered since nothing was really enqueued).
# Deliberately large: QUEUED is also the state of a legitimate backlog (e.g. HPA scale-up lag under a burst),
# so the default must clear any realistic backlog-drain time. `default` applies to any type without an
# explicit entry; per-routing-key overrides (app.jobreaper.max-queued-time.<key>) exist as an escape hatch
# for a future queue whose legitimate backlog-drain time exceeds the default — none is set today. NOTE:
# sodix/omega/ddb do NOT need one despite being labelled "import queues" elsewhere - each job is 1-2 fast
# REST calls resolving a link/reference (no download), not a bulk data import; even a >100k backlog drains
# in minutes at their K=50-per-pod concurrency, well inside the default.
app.jobreaper.default-max-queued-time=PT6H
# Max time a main job may sit PROCESSING without any sub-jobs (JobReceiver downloads the payload and creates the
# sub-jobs in this state; it only becomes permanent if the receiver fails AND cannot persist FAILED). Must exceed
# the longest realistic source-file download.
app.jobreaper.max-main-job-setup-time=PT1H

