# Stale-job reaper (master only): periodically times out orphaned PROCESSING sub-jobs whose conversion
# never completed (e.g. a converter pod crashed mid-job). Timed-out sub-jobs get SubJobStatus.TIMEOUT and
# their main job is reconciled to FAILED/PARTIALLY_FAILED — no re-queue (the frontend re-requests). This
# unblocks re-rendering (MainJobCreationService otherwise reuses the non-terminal job for 8 days). QUEUED
# sub-jobs are deliberately NOT reaped: during an import backlog they wait legitimately, and lost messages
# are handled by broker redelivery + the 8-day TTL. `schedule` is the fixed delay between runs in ms.
app.jobreaper.enabled=true
app.jobreaper.schedule=600000
# Max processing time per routing key (ISO-8601 Duration). Must exceed the longest *real* duration for that
# type or legitimately slow jobs get reaped. `default` applies to any type without an explicit entry; keys
# are the queue routing keys (app.queue.<module>.key), e.g. av_job runs longer (ffmpeg guard is PT30M).
app.jobreaper.default-max-process-time=PT30M
app.jobreaper.max-process-time.av_job=PT45M

