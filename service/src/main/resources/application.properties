app.appId=rendering2
app.appCaption=I am the new renderer!

## Currently valid roles: master,controller,converter,avconverter,job-manager
## Only one master per cluster is allowed
## Leave empty for all roles (or specify all)
app.roles=master,controller,converter,avconverter,job-manager

app.queue.topicExchange=rendering_exchange
app.queue.controllerBroadcastExchange=controller_broadcast_exchange
app.queue.registrationBroadcastExchange=registration_broadcast_exchange

# ── Queue tuning (one block per queue under app.queue.<queue>.*) ───────────────────────────────────
#   .name / .key    routing (queue name + topic routing key)
#   .concurrency    THE scaling knob: max messages processed in parallel per pod for this queue
#   .prefetch       (REMOTE only) broker prefetch; defaults to .concurrency
#
# A queue's MODE is a fachlich property, not a tuning knob, so it is fixed in code by which QueueSpec base
# class the module's `app.queue.<x>` bean extends (Standard/Remote/SingleActive), NOT set here. The modes:
#   STANDARD       .concurrency = number of DirectMessageListenerContainer consumers registered per pod.
#                  A burst is fanned out to all at once (no auto-scale ramp); idle consumers hold no
#                  thread because the listener executor uses virtual threads. Size CPU-in-JVM queues
#                  (image, eduHtml) and ffmpeg (av) against pod cores; pure-wait queues can go higher.
#   REMOTE         decoupled high-fan-out queue resolving externally-hosted material (sodix/omega/ddb —
#                  they only fetch a link/reference to it): ONE channel per pod, .concurrency = K sizes
#                  the dedicated remote HTTP pool AND the broker prefetch, and up to K messages run in
#                  parallel on virtual threads. Scale cluster throughput via more converter pods, not K.
#   SINGLE_ACTIVE  the broker keeps exactly one consumer active cluster-wide via x-single-active-consumer
#                  (only the h5p *import* queue — lumi imports one file at a time; the h5p lookup queue that
#                  precedes it is STANDARD); .concurrency is forced to 1.
#
# app.queue.prefetch is the single global prefetch for STANDARD/SINGLE_ACTIVE queues (the shared listener
# factory's prefetch is not per-queue; per-queue prefetch exists only for REMOTE queues via their own factory).
app.queue.prefetch=1

app.queue.job.name=rendering_job_queue_v2
app.queue.job.key=rendering_job_v2
app.queue.job.concurrency=20

app.queue.image.name=image_job_queue_v2
app.queue.image.key=image_job_v2
# image resamples in-JVM (Java2D/ImageIO) — the one CPU-in-JVM queue; size ~ pod cores (lower on shared worker/aio pods).
app.queue.image.concurrency=4

app.queue.av.name=av_job_queue_v2
app.queue.av.key=av_job_v2
# av spawns an off-heap ffmpeg process per message (the JVM thread only waits); keep low and scale via
# avconverter replicas. Effective host CPU ≈ concurrency × app.converter.video.ffmpegThreads.
app.queue.av.concurrency=10

# moodle blocks on the remote moodle (import + a restore poll of up to 10 min); STANDARD so imports fan out
# across pods instead of being serialized cluster-wide. Bounded by the moodle server's capacity.
app.queue.moodle.name=moodle_job_queue_v2
app.queue.moodle.key=moodle_job_v2
app.queue.moodle.concurrency=8

app.queue.edu-html.name=edu_html_job_queue_v2
app.queue.edu-html.key=edu_html_job_v2
# eduHtml unzips in-JVM (java.util.zip inflate = CPU spikes) but is mostly S3 I/O; shares the CPU
# budget with image on converter pods.
app.queue.edu-html.concurrency=5

# H5P runs in two stages on two queues, because the two have opposite scaling needs.
# Stage 1 — lookup: ask lumi whether the package is already imported. Read-only and pure wait (one HTTP call
# resolving an indexed Mongo query inside lumi), so STANDARD and free to fan out: this is what keeps concurrent
# renders of already-imported content from queueing up behind an import.
app.queue.h5p-lookup.name=h5p_lookup_job_queue_v2
app.queue.h5p-lookup.key=h5p_lookup_job_v2
app.queue.h5p-lookup.concurrency=20

# Stage 2 — import (lookup misses only): lumi imports one file at a time, so SINGLE_ACTIVE (fixed by
# H5pQueueProperties) keeps exactly one consumer active cluster-wide (concurrency forced to 1; the
# x-single-active-consumer argument is declared in H5pImportReceiver).
app.queue.h5p.name=h5p_import_job_queue_v2
app.queue.h5p.key=h5p_import_job_v2

app.queue.document.name=document_job_queue_v2
app.queue.document.key=document_job_v2
# document/jupyter block on the remote converter services — bound by their capacity, don't overrun them.
app.queue.document.concurrency=8

app.queue.jupyter.name=jupyter_job_queue_v2
app.queue.jupyter.key=jupyter_job_v2
app.queue.jupyter.concurrency=8

# Remote queues (sodix, omega, ddb): one blocking third-party HTTP call per message resolving a link/reference
# to externally-hosted material. REMOTE (fixed by the *QueueProperties beans) means a single channel per pod;
# concurrency=K sizes the remote HTTP pool + prefetch and K messages run on virtual threads. Scale throughput
# via more converter pods, NOT by raising concurrency.
app.queue.sodix.name=sodix_job_queue_v2
app.queue.sodix.key=sodix_job_v2
app.queue.sodix.concurrency=50

app.queue.omega.name=omega_job_queue_v2
app.queue.omega.key=omega_job_v2
app.queue.omega.concurrency=50

app.queue.ddb.name=ddb_job_queue_v2
app.queue.ddb.key=ddb_job_v2
app.queue.ddb.concurrency=50

app.queue.binder.name=binder_job_queue_v2
app.queue.binder.key=binder_job_v2
# Kept at 1 until git-upload concurrency-safety is confirmed; can be raised afterwards.
app.queue.binder.concurrency=1

app.queue.binder-preview.name=binder_preview_job_queue_v2
app.queue.binder-preview.key=binder_preview_job_v2
app.queue.binder-preview.concurrency=1

# .key was historically (wrongly) set to the queue name itself; fixed as part of the durability
# migration below since the old key is being retired anyway.
app.queue.onyx.name=onyx_job_queue_v2
app.queue.onyx.key=onyx_job_v2
app.queue.onyx.concurrency=8

# One-time durability migration (see LegacyQueueCleaner): all queues above were renamed with a "_v2"
# suffix (name AND routing key, so old- and new-code pods never share a topic-exchange binding during a
# rolling deploy) and switched to durable=true. In-place redeclaring an existing transient queue as
# durable fails with 406 PRECONDITION_FAILED, which mismatchedQueuesFatal=false would silently swallow -
# the rename avoids that entirely. LegacyQueueCleaner automatically deletes each old queue below once no
# consumer is attached to it anymore (i.e. once every pod has rolled over to the new name); disable via
# app.queue-migration.enabled=false once the migration is confirmed complete.
app.queue-migration.enabled=true
app.queue-migration.schedule=PT30M
app.queue-migration.legacy-queue-names=rendering_job_queue,image_job_queue,av_job_queue,moodle_job_queue,edu_html_job_queue,h5p_lookup_job_queue,h5p_import_job_queue,document_job_queue,jupyter_job_queue,onyx_job_queue,binder_job_queue,binder_preview_job_queue,sodix_job_queue,omega_job_queue,ddb_job_queue

app.converter.image.format=jpeg
app.converter.image.mimeTypes=image/vnd.wap.wbmp,image/x-png,image/jpeg,image/tiff,image/bmp,image/x-webp,image/webp
app.converter.image.sizes=800,1280,1920
## Reject source images larger than this many pixels (width*height) before decoding
app.converter.image.maxPixels=100000000

app.converter.spreadsheetToHtml.enabled=true

# Retry/timeout budget of ConverterWebServiceCaller for the document and jupyter converters (ConverterCallProperties;
# values are the code defaults). Only transient failures (502/503/504, connection errors, timeouts) are retried.
# attempt-timeout must stay above the converters' own limits (document 120s execution / 300s queue, jupyter 300s);
# total-budget must stay far below the reaper's app.jobreaper.default-max-process-time.
app.converter.call.max-attempts=3
app.converter.call.initial-backoff=2s
app.converter.call.max-backoff=20s
app.converter.call.attempt-timeout=330s
app.converter.call.total-budget=15m
# Cap for the delay requested by a 503 Retry-After header.
app.converter.call.max-retry-after=30s

## Which document types are converted, by file extension. Unknown entries are skipped with a
## warning; empty means all of them.
app.converter.document.extensions=doc,docx,ppt,pptx,xls,xlsx,odt,odp,ods,txt,ott,rtf,csv

app.converter.video.format=mp4
app.converter.video.mimeTypes=video/mp4,video/mpeg,video/quicktime,video/x-msvideo,video/vnd.avi,video/avi,video/x-flv,video/x-matroska,video/ogg,video/x-ms-wmv,video/theora
## 0 = ffmpeg decides how many threads to use, else specify the number of threads
app.converter.video.ffmpegThreads=2
app.converter.video.ffmpegPreset=veryfast
## Target heights, comma-separated (Helm config.converter.video.resolutions). Heights above the source are skipped
## (no upscaling); a source below the smallest height is converted at its own height.
app.converter.video.resolutions=480,720,1080
## RabbitMQ priority per height (higher = converted first, missing = 0). The maximum is the av queue's
## x-max-priority, which a durable queue cannot change - keep the maximum when you edit these.
app.converter.video.priorities.480=2
app.converter.video.priorities.720=1
app.converter.video.priorities.1080=0


app.converter.audio.mimeTypes=audio/mpeg,audio/mp4,audio/vnd.wav,audio/ogg,audio/vorbis,audio/wav,audio/x-wav,audio/x-ms-wma
app.converter.audio.bitrate=160000
## 0 = ffmpeg decides how many threads to use, else specify the number of threads
app.converter.audio.ffmpegThreads=1

## Max wall-clock time for a single AV (audio/video) ffmpeg conversion before it is aborted
## and the sub-job is marked FAILED. ISO-8601 duration.
## Hard ceiling: RabbitMQ's consumer_timeout (default 30 min) applies to the same message - the av queue acks only
## after the conversion, so a longer one makes the broker close the channel and redeliver it. Raising this value
## needs a larger consumer_timeout on the broker (rabbitmq.conf, or a "consumer-timeout" policy on the av queue).
## See docs/QUEUE_SCALING.md.
app.converter.av.conversionTimeout=PT30M
## Path to the ffmpeg executable jave should use. jave no longer bundles a binary
## (jave-nativebin-* was dropped); ffmpeg is installed in the container image / must be on
## PATH locally. Override with an absolute path if ffmpeg is not on PATH.
app.converter.av.ffmpegPath=ffmpeg
## OS priority (nice level, 0-19) ffmpeg is started with. ffmpeg shares the pod's CPU limit with the JVM; with a
## value > 0 the JVM (requests, image conversions, queue consumers) gets the CPU first while a long video encodes.
## 0 = same priority as the JVM. Lowering the own priority needs no privileges.
app.converter.av.niceness=0

app.lumi.host=http://localhost:3000
## How long lumi's content-bucket name/quota (GET /edusharing/buckets) is cached before being
## re-fetched. Queried on every admin storage-usage poll and by the CacheCleaner; the value changes
## essentially never at runtime, so a short TTL avoids an HTTP round trip to lumi on every poll tick.
## ISO-8601 duration.
app.lumi.bucketInfo.cacheTtl=PT1M
## Reverse proxy to lumi (LumiProxyProperties): upper bound for lumi to deliver status + headers of a proxied
## response (the body streams afterwards). Each proxied request holds a Tomcat thread for this long at most, so keep
## it short; a timeout is answered with 504. Breaker/bulkhead of the proxy: app.resilience.modules.lumi-proxy.*
app.lumi.proxy.response-headers-timeout=20s

app.documentConverter.host=http://localhost:8081
app.jupyterConverter.host=http://localhost:9120

# Resilience layer for calls to external systems (sodix, omega, omega-validation, ddb, github, lumi); ResilienceProperties,
# values are the code defaults. Retry applies only to idempotent GET/HEAD calls. The breaker counts consecutive
# infrastructure failures (5xx, connect/reset, timeout) per remote and pod. The bulkhead limits in-flight calls per remote
# and pod (keep >= the queue concurrency). enabled=false turns the whole layer into a pass-through. Metrics: rendering.remote.*
app.resilience.enabled=true
app.resilience.retry.max-attempts=3
app.resilience.retry.initial-backoff=200ms
app.resilience.retry.max-backoff=2s
app.resilience.retry.jitter=0.5
# A 429 whose Retry-After exceeds this is not retried.
app.resilience.retry.max-retry-after=5s
# Upper bound of one guarded call including all attempts; keep it below the queue/reaper timeouts.
app.resilience.retry.total-budget=75s
app.resilience.circuit-breaker.enabled=true
app.resilience.circuit-breaker.failure-threshold=5
app.resilience.circuit-breaker.open-duration=30s
app.resilience.circuit-breaker.half-open-max-calls=1
# Which failures count: DEFAULT (5xx except 501, connect/reset, timeout) or REACHABILITY_ONLY (connect/reset/timeout, 502/503/504).
app.resilience.circuit-breaker.failure-classification=DEFAULT
app.resilience.bulkhead.enabled=true
app.resilience.bulkhead.max-concurrent-calls=64
app.resilience.bulkhead.max-wait=0s
# Per-remote overrides (max-attempts, failure-threshold, open-duration, max-concurrent-calls, total-budget,
# failure-classification = DEFAULT|REACHABILITY_ONLY; unset = built-in defaults of that remote, then the sections above).
# failure-classification=REACHABILITY_ONLY counts only connect/reset/timeout failures and HTTP 502/503/504 against the
# breaker (a 500/507 does not); DEFAULT counts every 5xx except 501.
# lumi-proxy (reverse proxy, user path, never retried) and lumi-upload (package POST, never retried) have their own
# guards, separate from the lookup guard "lumi". Built-in defaults (code), spelled out here for reference:
app.resilience.modules.lumi-proxy.max-concurrent-calls=256
app.resilience.modules.lumi-proxy.open-duration=10s
app.resilience.modules.lumi-proxy.failure-classification=REACHABILITY_ONLY
app.resilience.modules.lumi-proxy.total-budget=5m
app.resilience.modules.lumi-upload.max-attempts=1
app.resilience.modules.lumi-upload.total-budget=15m
#app.resilience.modules.sodix.max-attempts=2
#app.resilience.modules.omega-validation.failure-threshold=10
#app.resilience.modules.ddb.open-duration=60s
#app.resilience.modules.lumi.max-concurrent-calls=32

# How the DDB consumer key is sent: QUERY (default, proven) or HEADER (Authorization: OAuth ..., keeps the key out of
# URIs/access logs, but UNVERIFIED against the live API - opt-in only, test with a real key first).
app.module.ddb.auth-mode=QUERY

app.binder.host="http://localhost:8675"

spring.http.codecs.max-in-memory-size=20MB

spring.mongodb.authentication-database=admin
spring.mongodb.host=localhost
spring.mongodb.username=admin
spring.mongodb.password=admin
spring.mongodb.database=rendering
spring.data.mongodb.auto-index-creation=true
# MongoDB driver timeouts (MongoTimeoutProperties; defaults in code). The driver default for socketTimeoutMS is infinite;
# the defaults here only bound stuck calls, not slow aggregations (cache cleaner).
#app.mongodb.timeout.connect-timeout=10s
#app.mongodb.timeout.socket-timeout=5m
#app.mongodb.timeout.server-selection-timeout=30s
# Size of the shared @Scheduled pool (minimum 4).
#app.scheduling.pool-size=4
# Startup sweep of orphaned job temp files (TempFileSweeper; defaults in code). /tmp survives a container restart,
# so files of jobs killed by an OOM/SIGKILL would otherwise stay. Only regular files named rendering-* directly in
# java.io.tmpdir older than stale-file-age are removed, once at startup. stale-file-age must exceed the longest job
# (e.g. app.converter.av.conversionTimeout).
#app.temp.cleanup.enabled=true
#app.temp.cleanup.stale-file-age=PT6H

# Distributed tracing (Micrometer Tracing + OpenTelemetry, b3 propagation to match Istio).
# A trace id is taken from the incoming b3 header when present, otherwise generated (128-bit hex);
# it is propagated onto outbound calls (WebClient/OkHttp/RabbitMQ) and added to every log line.
# The app does NOT export spans itself — in the Istio mesh the Envoy sidecar generates and reports
# the spans to the backend; the app only has to forward the b3 headers (see service/pom.xml).
spring.application.name=rendering2
spring.reactor.context-propagation=auto
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

# X-Client-Trace-Id is a client-supplied correlation id (distinct from the b3 trace id, see above) that
# is unrelated to Istio/Envoy sampling. Carried as Micrometer baggage so it rides every existing b3
# propagation path (WebClient, the edu-sharing OkHttp SDK, RabbitMQ publish/consume) without touching
# that code, and copied into the MDC under the same key so logging.pattern.correlation below can render it.
management.tracing.baggage.remote-fields=X-Client-Trace-Id
management.tracing.baggage.correlation.fields=X-Client-Trace-Id
# %correlationId is Boot's own conversion word (spec: "name(length),..."); this extends the default
# "traceId(32),spanId(16)" spec with our field instead of hand-rolling %X{} MDC lookups.
logging.pattern.correlation=%correlationId{traceId(32),spanId(16),X-Client-Trace-Id(0)}

management.endpoint.health.probes.enabled=true
# Health groups. LIVENESS must stay independent of every subsystem: a failing liveness probe restarts the pod, and a
# Mongo/Redis outage is not fixed by a restart (it would only turn an outage into a restart storm).
# READINESS carries the hard dependencies - without Mongo (jobs, registrations) or Redis (sessions, node permissions)
# every request fails, so the pod is taken out of the Service until they are back. S3 and RabbitMQ are deliberately
# not part of it (S3 only matters for some requests; the broker is re-connected automatically). A contributor that does
# not exist in a deployment (disabled via management.health.<name>.enabled=false) is simply skipped; to drop a
# dependency from readiness override this list, e.g. management.endpoint.health.group.readiness.include=readinessState.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo,redis
# Graceful shutdown. On SIGTERM readiness goes REFUSING_TRAFFIC at once; the web server stops accepting connections and
# drains in-flight requests, and the RabbitMQ listener containers drain their in-flight jobs (shutdownTimeout 35 min in
# QueueConfig). Both live in the same SmartLifecycle stop phase (Integer.MAX_VALUE) and stop concurrently; the phase is
# waited for at most timeout-per-shutdown-phase. The Boot default of 30 s would let the context close (and the JVM exit)
# while an ffmpeg job is still running. Keep this just above the 35 min container shutdownTimeout and below the pod's
# terminationGracePeriod (Helm: 2400 s = 40 min, which also leaves room for the phases after this one).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=36m
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,metrics,prometheus,loggers

management.server.address=0.0.0.0
management.server.port=9080

server.servlet.session.cookie.name=SESSION_RS2
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.partitioned=false


springdoc.api-docs.version=openapi_3_1
# Without this, controllers that don't declare `produces` emit `*/*` as the response media type,
# which the generated admin-frontend client maps to responseType 'blob' (JSON never parsed).
springdoc.default-produces-media-type=application/json
springdoc.api-docs.groups.enabled=true
springdoc.group-configs[0].group=api
springdoc.group-configs[0].display-name=API
springdoc.group-configs[0].paths-to-match=/public/**

springdoc.group-configs[1].group=administration
springdoc.group-configs[1].display-name=Administration
springdoc.group-configs[1].paths-to-match=/admin/**


logging.level.org.edu_sharing.rendering.core.dto.ErrorMessage=WARN
logging.level.ws.schild.jave=WARN
