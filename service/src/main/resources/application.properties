# Distributed tracing (Micrometer Tracing + OpenTelemetry, b3 propagation to match Istio).
# A trace id is taken from the incoming b3 header when present, otherwise generated (128-bit hex);
# it is propagated onto outbound calls (WebClient/OkHttp/RabbitMQ) and added to every log line.
# The app does NOT export spans itself — in the Istio mesh the Envoy sidecar generates and reports
# the spans to the backend; the app only has to forward the b3 headers (see service/pom.xml).
spring.application.name=rendering2
spring.reactor.context-propagation=auto
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,metrics,prometheus,loggers

