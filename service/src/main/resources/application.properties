spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Continue the trace across the queue: observe the auto-configured listener factory (used by JobReceiver)
# too, so it reads the b3 trace context from the message headers. The shared queueListenerContainerFactory
# and the publishing RabbitTemplate enable observation in QueueConfig directly.
spring.rabbitmq.listener.simple.observation-enabled=true
# Publisher confirms/returns: without them, a publish that never reaches the broker (confirm) or hits no
# matching queue binding (return, e.g. mid rolling-deploy before a consumer has (re-)declared its queue)
# is silently lost. QueueConfig.amqpTemplate logs both cases loudly. See ConfirmCallback/ReturnsCallback.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Consumer channels alone can exceed the Boot default cache of 25 on the converter/aio/worker roles
# (13+ receivers, several with concurrency > 1); a too-small cache causes channel churn on reconnects.
# NOTE: publish and consume still share one connection (CacheMode.CHANNEL, one connection per pod) - Boot
# has no property for a separate publisher connection; that would need a second, manually wired
# CachingConnectionFactory dedicated to the RabbitTemplate. Not done here (out of scope for this change).
# The cache size is a HARD limit as soon as checkout-timeout is set (below): it must cover every consumer channel of
# a pod (sum of app.queue.<x>.concurrency of the STANDARD queues + one channel per REMOTE queue, ~100 with the
# defaults) plus the channels concurrent publishers hold. If you raise queue concurrencies, raise this too.
spring.rabbitmq.cache.channel.size=400
# Bounded waits instead of Boot/driver defaults (connection: none/infinite-ish, channel RPC: 10 min):
# - connection-timeout: TCP connect + AMQP handshake to the broker.
# - channel-rpc-timeout: max wait for the reply to a channel RPC (declare, bind, cancel, ...); NOT message processing.
# - requested-heartbeat: lets both sides detect a half-open connection (conntrack/LB reaping) within ~2 intervals;
#   heartbeats run on their own thread, so long-running message handlers (35 min ffmpeg) are unaffected.
# - checkout-timeout: how long a publisher waits for a free channel when the cache is exhausted (fail instead of block).
spring.rabbitmq.connection-timeout=10s
spring.rabbitmq.channel-rpc-timeout=30s
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.cache.channel.checkout-timeout=30s

