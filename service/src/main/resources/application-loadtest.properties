
logging.level.org.springframework.security=INFO

# Lasttest-Profil — NUR für lokale Converter-Lasttests, niemals produktiv.
#
# Zusammen mit dem debug-Profil aktivieren, das dieses überschreiben soll:
#   -Dspring.profiles.active=debug,loadtest
# (debug liefert app.security.enabled=false, die root-compose.yml-Ports und die lokale
#  Repository-Registrierung; loadtest ergänzt nur die Lasttest-Deltas.)
#
# Mit app.security.enabled=false (aus debug) greift der TEST-Bypass:
#  - repoId mit Präfix "TEST"  -> synthetische Registrierung (RepositoryRegistrationStorageService)
#  - nodeId mit Präfix "TEST_" -> Quelldatei vom Classpath (ContentTransferService),
#    z. B. nodeId "TEST_loadtest/image.jpg" -> classpath:loadtest/image.jpg
# Die Sample-Dateien liegen unter service/src/main/resources/loadtest/.

# Optionale Module für den Lasttest freischalten. image/av/document/pdf sind immer aktiv und
# brauchen keinen Eintrag; JUPYTER/H5P/HTML sind optional und werden hier ergänzt.
# SODIX/OMEGA/DDB sind Drittanbieter-Import-Module und werden gegen den WireMock-Container
# (rendering2-thirdparty-mock, Host-Port 8092) gefahren — siehe Credentials/URLs unten.
app.repository.registration.id.local.optional-modules=JUPYTER,H5P,HTML,OMEGA,SODIX,DDB

# --- Drittanbieter-Mock-APIs (WireMock, http://localhost:8092) ------------------------------
# SODIX: baseurl MUSS auf "/" enden — der Client hängt "render/playout" bzw. "render/paidmedia"
# ohne führenden Slash an. Der Sodix-Stub verzögert 1–2 s (siehe loadtest/mocks/wiremock).
app.repository.registration.id.local.module.SODIX.credentials.baseurl=http://localhost:8092/sodix/
# OMEGA: baseurl ist der vollständige Endpoint (Query token_id/role/user wird angehängt). Die
# HEAD-URL-Validierung und die Identifier-Whitelist werden für den Lasttest deaktiviert
# (validateUrls=false, leere Whitelist überschreibt den debug-Wert FWU-049,…).
app.repository.registration.id.local.module.OMEGA.credentials.baseurl=http://localhost:8092/omega/get
app.repository.registration.id.local.module.OMEGA.credentials.user=loadtest
app.repository.registration.id.local.module.OMEGA.credentials.validateUrls=false
app.repository.registration.id.local.module.OMEGA.credentials.identifierPrefixWhitelist=
# DDB: apiToken via Credential; die (sonst hartkodierten) Basis-URLs zeigen auf den Mock.
app.repository.registration.id.local.module.DDB.credentials.apiToken=loadtest
app.module.ddb.rest-api-base-url=http://localhost:8092/ddb/rest
app.module.ddb.iiif-api-base-url=http://localhost:8092/ddb/iiif

# Converter-Sidecar-Hosts auf die Ports der root-compose.yml. document-converter (8081) und
# jupyter-converter (9120) entsprechen bereits den Defaults; lumi wird in der root-compose.yml
# auf 9112 gemappt (nicht 3000) und muss darum überschrieben werden.
app.lumi.host=http://localhost:9112
app.jupyterConverter.host=http://localhost:9120
app.documentConverter.host=http://localhost:8081
