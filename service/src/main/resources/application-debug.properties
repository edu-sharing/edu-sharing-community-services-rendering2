app.security.enabled=false
app.repository.registration.enabled=false

logging.level.org.springframework.security=DEBUG

## 0 = ffmpeg decides how many threads to use, else specify the number of threads
app.converter.video.ffmpegThreads=0
app.converter.video.ffmpegPreset=veryfast
app.converter.audio.ffmpegThreads=0

app.repository.registration.id.local.url=http://repository.127.0.0.1.nip.io/edu-sharing
app.repository.registration.id.local.username=admin
app.repository.registration.id.local.password=admin
# Also accepts a human-readable size, e.g. 1GB (Spring's binary units: 1KB = 1024 bytes).
app.repository.registration.id.local.quota=1GB
app.repository.registration.id.local.optional-modules=OMEGA

app.repository.registration.id.local.module.OMEGA.credentials.baseurl=https://cp.sodis.de/api/get
app.repository.registration.id.local.module.OMEGA.credentials.user=omega
app.repository.registration.id.local.module.OMEGA.credentials.validateUrls=true
app.repository.registration.id.local.module.OMEGA.credentials.identifierPrefixWhitelist=FWU-049,FWU-055,FWU-056

