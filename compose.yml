version: '3.8'

services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9101:9000"   # S3 API endpoint
      - "9111:9001"   # Web console
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rendering2
      - RUSTFS_SECRET_KEY=rendering2
      - RUST_BACKTRACE=full
      #- RUSTFS_TLS_PATH=/opt/tls
      #- RUSTFS_OBS_LOGGER_LEVEL=debug
      #- RUSTFS_CORS_ALLOWED_ORIGINS=*
      #- RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    #volumes:
    #  - ./tls:/opt/tls:ro
    command: [ "rustfs" ]

  repository-cache:
    image: docker.edu-sharing.com/community/common/edu_sharing-community-common-docker-redis:6.2.7
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "9109:6379"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: "rendering"
      RABBITMQ_DEFAULT_PASS: "rendering"
      RABBITMQ_SECURE_PASSWORD: true
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: true
    ports:
      - "9104:5672"
      - "15672:15672"
      # Prometheus-Plugin (im offiziellen rabbitmq-Image standardmäßig aktiv) für den Lasttest:
      # Queue-Tiefe/Consumer-Metriken unter :15692/metrics.
      - "15692:15692"

  mongo:
    image: "docker.edu-sharing.com/community/common/edu_sharing-community-common-docker-mongodb:7.0.15"
    environment:
      MONGODB_ROOT_USER: admin
      MONGODB_ROOT_PASSWORD: admin
      MONGODB_EXTRA_RENDERING2_DATABASE: "rendering"
      MONGODB_EXTRA_RENDERING2_USERNAME: "rendering"
      MONGODB_EXTRA_RENDERING2_PASSWORD: "rendering"
      MONGODB_EXTRA_LUMI_DATABASE: "lumi"
      MONGODB_EXTRA_LUMI_USERNAME: "lumi"
      MONGODB_EXTRA_LUMI_PASSWORD: "lumi"
    ports:
      - "9106:27017"

  rendering2-document-converter:
    image: "docker.edu-sharing.com/community/edu_sharing-community-services-rendering2-deploy-docker-build-document-converter:maven-fixes-10.0-SNAPSHOT"
    command:
      - -Xms${REPOSITORY_SEARCH_ELASTIC_TRACKER_JAVA_XMS:-512m}
      - -Xmx${REPOSITORY_SEARCH_ELASTIC_TRACKER_JAVA_XMX:-512m}
      - -Dcom.sun.management.jmxremote
      - -Dcom.sun.management.jmxremote.authenticate=false
      - -Dcom.sun.management.jmxremote.port=7199
      - -Dcom.sun.management.jmxremote.ssl=false
    ports:
      - "8081:8080"

  rendering2-jupyter-converter:
    image: "docker.edu-sharing.com/community/edu_sharing-community-services-rendering2-deploy-docker-build-jupyter-converter:maven-fixes-10.0-SNAPSHOT"
    ports:
      - "9120:8000"

  rendering2-lumi:
    image: "docker.edu-sharing.com/community/edu_sharing-community-services-rendering2-deploy-docker-build-lumi:maven-fixes-10.0-SNAPSHOT"
    environment:
      AWS_ACCESS_KEY_ID: K2CV0VBADESIZ0IOIKGZ
      AWS_SECRET_ACCESS_KEY: Pbq0qBtcq7ZDoc6pMm3Bsfy8lj4BB2UChcYVSTGY
      AWS_S3_ENDPOINT: https://s3.gwdg.de:443
     # S3_HOST: https://s3.gwdg.de
     # S3_PORT: "443"
      AWS_S3_MAX_FILE_LENGTH: 1000
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_URL: mongodb://lumi:lumi@mongo:27017/lumi
      MONGODB_AUTH_DB: "lumi"
      MONGODB_DB: "lumi"
      MONGODB_USER: "lumi"
      MONGODB_PASSWORD: "lumi"
      CONTENT_AWS_S3_BUCKET: itsjointly-test3
      CONTENT_MONGO_COLLECTION: h5p
      TEMPORARY_AWS_S3_BUCKET: itsjointly-test4
      LIBRARY_MONGO_COLLECTION: h5plibraries
      LIBRARY_AWS_S3_BUCKET: itsjointly-test5
      USERDATA_MONGO_COLLECTION: userdata
      FINISHED_MONGO_COLLECTION: finisheddata
      EDUSHARING_MONGO_COLLECTION: edusharing
      BASE_URL: /public/h5p
      CACHE: in-memory
      LOG_LEVEL: debug
      LOG_SCOPE: h5p:*
    ports:
      - "9112:3000"


  # Mock für die Drittanbieter-Import-APIs (sodix, omega, ddb) im Lasttest. Ein einziger
  # WireMock-Container bedient alle drei über Pfad-Präfixe (/sodix, /omega, /ddb). Die
  # Mappings liegen unter loadtest/mocks/wiremock/mappings. Der Service (Profil loadtest)
  # zeigt per Credentials/Property auf http://localhost:8092/... — siehe
  # application-loadtest.properties. --global-response-templating erlaubt es den Stubs, den
  # angefragten Identifier zurückzuspiegeln (nötig für omega: get.identifier muss matchen).
  # Die Sodix-Stubs verzögern die Antwort um 1–2 s (delayDistribution), um die reale API
  # nachzubilden.
  # --async-response-enabled: verzögerte Antworten (sodix 1–2 s) belegen KEINEN Container-Thread,
  # sonst würde der Mock bei vielen gleichzeitigen sodix-Consumern am Thread-Pool verhungern und
  # das Queue-Scaling verfälschen. container/async-threads großzügig für die Lastspitzen.
  rendering2-thirdparty-mock:
    image: wiremock/wiremock:3.9.1
    command:
      - "--global-response-templating"
      - "--disable-banner"
      - "--async-response-enabled"
      - "true"
      - "--async-response-threads"
      - "100"
      - "--container-threads"
      - "100"
    volumes:
      - ./loadtest/mocks/wiremock:/home/wiremock:ro
    ports:
      - "8092:8080"

  onix-service:
    image: "docker.edu-sharing.com/community/common/edu_sharing-community-common-docker-onyx:2025.05.1-0"
    environment:
      CATALINA_OPTS: >-
        -Xms${REPOSITORY_SERVICE_JAVA_XMS:-500m}
        -Xmx${REPOSITORY_SERVICE_JAVA_XMX:-1g}
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.port=7199
        -Dcom.sun.management.jmxremote.ssl=false
        -javaagent:/opt/onyx/tomcat/agent/jmx_prometheus_javaagent.jar=9090:/opt/onyx/tomcat/agent/jmx-exporter-config.yaml
      ONYX_SERVICE_PROT_EXTERNAL: "${ONYX_SERVICE_PROT_EXTERNAL:-http}"
      ONYX_SERVICE_HOST_EXTERNAL: "${ONYX_SERVICE_HOST_EXTERNAL:-onyx.127.0.0.1.nip.io}"
      ONYX_SERVICE_PORT_EXTERNAL: "${ONYX_SERVICE_PORT_EXTERNAL:-15080}"
      ONYX_SERVICE_PATH_EXTERNAL: "${ONYX_SERVICE_PATH_EXTERNAL:-/onyxplayer}"
      ALLOW_EMPTY_PASSWORD: "yes"
    expose:
      - "8080"
    ports:
      - "15100:8080"

