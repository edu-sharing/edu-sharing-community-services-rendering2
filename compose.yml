version: '3.8'

services:

  minio:
    image: bitnami/minio:latest
    ports:
      - "9110:9000"
      - "9111:9001"
    environment:
      - MINIO_ROOT_USER=adminuser
      - MINIO_ROOT_PASSWORD=adminpassword
      - MINIO_DEFAULT_BUCKETS=edu-test-bucket
    #volumes:
    #  - "minio-data-volume:/bitnami/minio/data"

  repository-cache:
    image: docker.edu-sharing.com/community/common/edu_sharing-community-common-docker-redis:6.2.7
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"

volumes:
  minio-data-volume:
