spring.application.name=edu-sharing community services document converter

jodconverter.local.enabled=true

# One LibreOffice process converts one document at a time, so the number of ports = the number of
# parallel conversions per pod. Keep it in sync with the pod's CPU/memory (~1 vCPU + ~1 GiB per process)
# and with the callers' concurrency (service: app.queue.document.concurrency, per service pod).
jodconverter.local.port-numbers=${LIBREOFFICE_PORT_NUMBERS:2002}
# Recycle a process after N conversions (bounds LibreOffice memory leaks) and kill hung conversions.
jodconverter.local.max-tasks-per-process=${LIBREOFFICE_MAX_TASKS_PER_PROCESS:100}
jodconverter.local.task-execution-timeout=${LIBREOFFICE_TASK_EXECUTION_TIMEOUT:120000}
# How long a request waits for a free process before failing (jodconverter default 30s is too short
# for bursts, since callers send more requests than there are processes).
jodconverter.local.task-queue-timeout=${LIBREOFFICE_TASK_QUEUE_TIMEOUT:300000}

app.supportedExtensions=doc,docx,ppt,pptx,xls,xlsx,odt,odp,ods,txt,ott,rtf,csv

spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB

# Distributed tracing: adopt the incoming b3 trace id (sent by the rendering service / Istio) so it
# appears in every log line. The app exports no spans itself — the Envoy sidecar collects them (see pom.xml).
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

# X-Client-Trace-Id is a client-supplied correlation id (distinct from the b3 trace id above), forwarded
# by the rendering service as Micrometer baggage. Adopt it into the MDC so it shows up here too.
management.tracing.baggage.remote-fields=X-Client-Trace-Id
management.tracing.baggage.correlation.fields=X-Client-Trace-Id
logging.pattern.correlation=%correlationId{traceId(32),spanId(16),X-Client-Trace-Id(0)}

management.endpoint.health.probes.enabled = true
management.endpoint.health.show-details = always
management.endpoint.health.show-components = always
management.endpoints.web.exposure.include = health,metrics,prometheus
management.server.address=0.0.0.0
management.server.port=8081
