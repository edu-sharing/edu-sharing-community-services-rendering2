spring.application.name=edu-sharing community services document converter

jodconverter.local.enabled=true

# One LibreOffice process converts one document at a time, so the number of ports = the number of
# parallel conversions per pod. Keep it in sync with the pod's CPU/memory (~1 vCPU + ~1 GiB per process)
# and with the callers' concurrency (service: app.queue.document.concurrency, per service pod).
jodconverter.local.port-numbers=${LIBREOFFICE_PORT_NUMBERS:2002}
# Recycle a process after N conversions (bounds LibreOffice memory leaks) and kill hung conversions.
jodconverter.local.max-tasks-per-process=${LIBREOFFICE_MAX_TASKS_PER_PROCESS:100}
jodconverter.local.task-execution-timeout=${LIBREOFFICE_TASK_EXECUTION_TIMEOUT:120000}
# How long a request waits for a free process before failing (jodconverter default 30s is too short
# for bursts, since callers send more requests than there are processes).
jodconverter.local.task-queue-timeout=${LIBREOFFICE_TASK_QUEUE_TIMEOUT:300000}

# Time to start/connect/terminate one office process, and the pause between attempts (jodconverter defaults
# made explicit). Keep the staggering: task-execution-timeout (120s) < task-queue-timeout (300s) < the caller's
# client timeout (600s), otherwise a queued request outlives its caller. Not exposed by jodconverter 5.1.1
# (so not configurable here): disabling OpenGL, which would need a template profile.
jodconverter.local.process-timeout=${LIBREOFFICE_PROCESS_TIMEOUT:120000}
jodconverter.local.process-retry-interval=${LIBREOFFICE_PROCESS_RETRY_INTERVAL:250}

app.supportedExtensions=doc,docx,ppt,pptx,xls,xlsx,odt,odp,ods,txt,ott,rtf,csv

# Re-write word processing sources through LibreOffice's own docx filter before converting them.
# Works around LibreOffice dropping the content of tables nested in a floating text box; costs a
# second LibreOffice pass per document.
app.normalizeTextDocuments=true

spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB

# Distributed tracing: adopt the incoming b3 trace id (sent by the rendering service / Istio) so it
# appears in every log line. The app exports no spans itself — the Envoy sidecar collects them (see pom.xml).
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

# X-Client-Trace-Id is a client-supplied correlation id (distinct from the b3 trace id above), forwarded
# by the rendering service as Micrometer baggage. Adopt it into the MDC so it shows up here too.
management.tracing.baggage.remote-fields=X-Client-Trace-Id
management.tracing.baggage.correlation.fields=X-Client-Trace-Id
logging.pattern.correlation=%correlationId{traceId(32),spanId(16),X-Client-Trace-Id(0)}

management.endpoint.health.probes.enabled = true
management.endpoint.health.show-details = always
management.endpoint.health.show-components = always
management.endpoints.web.exposure.include = health,metrics,prometheus
management.server.address=0.0.0.0
management.server.port=8081

# Temp files of the conversion pipeline (empty = <java.io.tmpdir>/doc-converter) and the startup sweep of stale
# temp files / LibreOffice profile directories.
app.converter.work-dir=${CONVERTER_WORK_DIR:}
app.converter.stale-file-age=${CONVERTER_STALE_FILE_AGE:6h}
app.converter.html-style-scan-window=${CONVERTER_HTML_STYLE_SCAN_WINDOW:256KB}
app.converter.max-html-dom-bytes=${CONVERTER_MAX_HTML_DOM_SIZE:32MB}

# LibreOffice readiness check (txt->pdf probe, cached). Part of the readiness group only; liveness is
# deliberately independent so a busy/hung LibreOffice does not get the pod killed by the liveness probe.
app.converter.health.probe-enabled=${LIBREOFFICE_HEALTH_PROBE_ENABLED:true}
app.converter.health.probe-timeout=${LIBREOFFICE_HEALTH_PROBE_TIMEOUT:10s}
app.converter.health.cache-ttl=${LIBREOFFICE_HEALTH_CACHE_TTL:30s}
app.converter.health.failure-threshold=${LIBREOFFICE_HEALTH_FAILURE_THRESHOLD:3}
management.endpoint.health.group.readiness.include=readinessState,libreOffice
management.endpoint.health.group.liveness.include=livenessState
