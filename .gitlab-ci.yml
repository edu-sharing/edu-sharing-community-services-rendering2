cache:
  key: $CI_BUILD_REF_NAME
  paths:
    - .m2/repository

variables:
  COMMON_BIND_HOST: "0.0.0.0"
  DOCKER_DRIVER: "$DIND_DRIVER"
  DOCKER_HOST: "$DIND_HOST"
  DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  DOCKER_USERNAME: "$DOCKER_USERNAME"
  DOCKER_PASSWORD: "$DOCKER_PASSWORD"
  MAVEN_CLI: "-Dmaven.deploy.releases=$MAVEN_DEPLOY_RELEASES -Dmaven.deploy.snapshots=$MAVEN_DEPLOY_SNAPSHOTS --batch-mode --errors --fail-fast --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

default:
  image: maven:3.8.4-eclipse-temurin-17
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]

stages:
  - deploy

deploy:
  stage: deploy
  variables:
    ENABLE_DOCKER_DAEMON_BUILD: "false"
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml deploy -P docker.deploy -DskipTests


build-jupyter-converter:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - cd ./jupyter-converter
    - docker build \
      -build-arg git_branch=$CI_COMMIT_REF_NAME \
      -build-arg git_closest_tag_fixed=$(git describe --tags --abbrev=0) \
      -build-arg git_commit_id=$CI_COMMIT_SHA \
      -build-arg git_dirty=$(if [ -n \"$(git status --porcelain)\" ]; then echo true; else echo false; fi) \
      -build-arg mvn.project.version=$CI_COMMIT_REF_SLUG-SNAPSHOT \      
      .
    - docker push $DOCKER_REGISTRY/edu_sharing-community-services-rendering2-deploy-docker-build-jupyter-converter:$CI_COMMIT_REF_SLUG-SNAPSHOT

release-jupyter-converter:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd ./jupyter-converter
    - docker build \
      -build-arg git_branch=$CI_COMMIT_TAG \
      -build-arg git_closest_tag_fixed=$(git describe --tags --abbrev=0) \
      -build-arg git_commit_id=$CI_COMMIT_SHA \
      -build-arg git_dirty=$(if [ -n \"$(git status --porcelain)\" ]; then echo true; else echo false; fi) \
      -build-arg mvn.project.version=$CI_COMMIT_TAG \
      .
    - docker push $DOCKER_REGISTRY/edu_sharing-community-services-rendering2-deploy-docker-build-jupyter-converter:$CI_COMMIT_TAG
