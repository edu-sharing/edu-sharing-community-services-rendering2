cache:
  key: $CI_BUILD_REF_NAME
  paths:
    - .m2/repository

variables:
  COMMON_BIND_HOST: "0.0.0.0"
  DEPLOY_DOCKER_HELM: "true"
  DEPLOY_TIMESTAMP: "$DEPLOY_TIMESTAMP"
  DOCKER_DRIVER: "$DIND_DRIVER"
  DOCKER_HOST: "$DIND_HOST"
  DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  DOCKER_USERNAME: "$DOCKER_USERNAME"
  DOCKER_PASSWORD: "$DOCKER_PASSWORD"
  MAVEN_CLI: "-Ddocker.registry=$DOCKER_REGISTRY -Dhelm.deploy.url=$HELM_REGISTRY -Dhelm.deploy.type=$HELM_TYPE -Dmaven.deploy.releases=$MAVEN_DEPLOY_RELEASES -Dmaven.deploy.snapshots=$MAVEN_DEPLOY_SNAPSHOTS -Dversioning.configFile=maven-git-versioning-extension-ci.xml --batch-mode --errors --fail-fast --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

default:
  image: maven:3.9.9-eclipse-temurin-21
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]
stages:
  - verify
  - deploy

# Verifiziert, dass die ins admin-frontend eingecheckte OpenAPI-Spec (openapi/admin-api.json)
# mit dem übereinstimmt, was der aktuelle Backend-Code produziert ("committed vs live").
# Läuft vor dem Deploy; bei Drift bricht der Job ab und blockiert das Deploy. Der Test bootet
# den Service-Kontext via Testcontainers (DinD aus dem default-Service) und holt die
# administration-OpenAPI-Gruppe.
verify:admin-api-contract:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "pipeline" && $SKIP_TESTS != "true"
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml -pl service -am test -Dtest=AdminOpenApiContractTest -DfailIfNoTests=false
  artifacts:
    paths:
      - service/target/surefire-reports
    when: on_failure
    expire_in: 3 day

deploy:
  stage: deploy
  variables:
    ENABLE_DOCKER_DAEMON_BUILD: "false"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null
  before_script:
    - apt-get update -y
    - apt-get install -y unzip
    - pushd /tmp
    - wget https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz
    - tar -xzvf helm-v3.14.2-linux-amd64.tar.gz
    - ./linux-amd64/helm repo add edu-sharing https://artifacts.edu-sharing.com/repository/helm
    - popd
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml deploy
  artifacts:
    paths:
      - service/target/surefire-reports
      - document-converter/target/surefire-reports
    when: on_failure
    expire_in: 3 day
