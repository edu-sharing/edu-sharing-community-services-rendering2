cache:
  key: $CI_BUILD_REF_NAME
  paths:
    - .m2/repository

variables:
  COMMON_BIND_HOST: "0.0.0.0"
  DEPLOY_DOCKER_HELM: "true"
  DEPLOY_TIMESTAMP: "$DEPLOY_TIMESTAMP"
  DOCKER_DRIVER: "$DIND_DRIVER"
  DOCKER_HOST: "$DIND_HOST"
  DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  DOCKER_USERNAME: "$DOCKER_USERNAME"
  DOCKER_PASSWORD: "$DOCKER_PASSWORD"
  MAVEN_CLI: "-Ddocker.registry=$DOCKER_REGISTRY -Dhelm.deploy.url=$HELM_REGISTRY -Dhelm.deploy.type=$HELM_TYPE -Dmaven.deploy.releases=$MAVEN_DEPLOY_RELEASES -Dmaven.deploy.snapshots=$MAVEN_DEPLOY_SNAPSHOTS -Dversioning.configFile=maven-git-versioning-extension-ci.xml --batch-mode --errors --fail-fast --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

default:
  image: maven:3.9.9-eclipse-temurin-21
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]
stages:
  - verify
  - deploy

# Verifiziert, dass die ins admin-frontend eingecheckte OpenAPI-Spec (openapi/admin-api.json)
# mit dem übereinstimmt, was der aktuelle Backend-Code produziert ("committed vs live").
# Läuft vor dem Deploy; bei Drift bricht der Job ab und blockiert das Deploy. Der Test bootet
# den Service-Kontext via Testcontainers (DinD aus dem default-Service) und holt die
# administration-OpenAPI-Gruppe.
verify:admin-api-contract:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "pipeline" && $SKIP_TESTS != "true"
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml -pl service -am test -Dtest=AdminOpenApiContractTest -DfailIfNoTests=false
  artifacts:
    paths:
      - service/target/surefire-reports
    when: on_failure
    expire_in: 3 day

deploy:
  stage: deploy
  variables:
    ENABLE_DOCKER_DAEMON_BUILD: "false"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH !~ /^maven\/release\/.*/ && $CI_COMMIT_TAG == null
  before_script:
    - apt-get update -y
    - apt-get install -y unzip
    - pushd /tmp
    - wget https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz
    - tar -xzvf helm-v3.14.2-linux-amd64.tar.gz
    - ./linux-amd64/helm repo add edu-sharing https://artifacts.edu-sharing.com/repository/helm
    - popd
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml deploy
  artifacts:
    paths:
      - service/target/surefire-reports
      - document-converter/target/surefire-reports
    when: on_failure
    expire_in: 3 day

check-helmreadme:
  stage: verify
  image: node:lts-alpine3.20
  before_script:
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/admin-frontend/src/main/chart      /tmp/admin-frontend     && cp /tmp/admin-frontend/README.md     /tmp/README_admin-frontend.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/bundle/src/main/chart              /tmp/bundle             && cp /tmp/bundle/README.md             /tmp/README_bundle.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/document-converter/src/main/chart  /tmp/document-converter && cp /tmp/document-converter/README.md /tmp/README_document-converter.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/jupyter-converter/src/main/chart   /tmp/jupyter-converter  && cp /tmp/jupyter-converter/README.md  /tmp/README_jupyter-converter.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/lumi/src/main/chart                /tmp/lumi               && cp /tmp/lumi/README.md               /tmp/README_lumi.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/service/src/main/chart             /tmp/service            && cp /tmp/service/README.md            /tmp/README_service.md
  script:
    - wget -qO- https://github.com/bitnami/readme-generator-for-helm/archive/refs/tags/2.6.1.tar.gz | tar -xz -C /tmp
    - cd /tmp; npm install ./readme-generator-for-helm-2.6.1; cd readme-generator-for-helm-2.6.1
    - ./bin/index.js -v /tmp/admin-frontend/values.yaml     -r /tmp/README_admin-frontend.md
    - ./bin/index.js -v /tmp/bundle/values.yaml             -r /tmp/README_bundle.md
    - ./bin/index.js -v /tmp/document-converter/values.yaml -r /tmp/README_document-converter.md
    - ./bin/index.js -v /tmp/jupyter-converter/values.yaml  -r /tmp/README_jupyter-converter.md
    - ./bin/index.js -v /tmp/lumi/values.yaml               -r /tmp/README_lumi.md
    - ./bin/index.js -v /tmp/service/values.yaml            -r /tmp/README_service.md
    - diff /tmp/README_admin-frontend.md      /tmp/admin-frontend/README.md     || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_bundle.md              /tmp/bundle/README.md             || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_document-converter.md  /tmp/document-converter/README.md || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_jupyter-converter.md   /tmp/jupyter-converter/README.md  || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_lumi.md                /tmp/lumi/README.md               || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_service.md             /tmp/service/README.md            || (echo "README was not generated before committing." && exit 1)

